<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Таблица Брадиса — калькулятор</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:#1a2d3c;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:16px;flex-direction:column;font-family:'Inter','Segoe UI',sans-serif;transition:background 0.3s;}
        :root.light-mode body{background:#eef2f8;}

        .header-block{max-width:550px;width:100%;margin-bottom:12px;position:relative;}
        .header-block .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            border-left: 4px solid #8b5cf6;
            padding: 16px 20px;
            text-align: center;
            background: #162a38;
            border-radius: 16px;
            border: 1px solid rgba(46,204,113,0.1);
            transition: all 0.3s;
        }
        :root.light-mode .header-block .section-title{background:#ffffff;border-color:#d0d9e8;color:#1a2a3f;}
        .header-block .section-title .main-title{color:#fff;display:flex;align-items:center;gap:8px;justify-content:center;}
        :root.light-mode .header-block .section-title .main-title{color:#1a2a3f;}
        .header-block .section-title .sub-title{font-size:0.85rem;color:#8ba5b8;font-weight:400;font-style:italic;}
        :root.light-mode .header-block .section-title .sub-title{color:#4a6a8a;}

        .wrapper{background:#162a38;border-radius:20px;padding:24px;border:1px solid rgba(46,204,113,0.1);max-width:550px;width:100%;transition:background 0.3s;}
        :root.light-mode .wrapper{background:#ffffff;border-color:#d0d9e8;}

        .input-group{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;justify-content:center;}
        .input-group .angle-inputs{display:flex;gap:6px;flex:2;min-width:200px;align-items:center;}
        .input-group .angle-inputs input{flex:1;min-width:40px;padding:10px 8px;background:#1e3545;border:1px solid rgba(46,204,113,0.15);border-radius:10px;font-size:0.95rem;color:#fff;text-align:center;outline:none;transition:0.3s;}
        :root.light-mode .input-group .angle-inputs input{background:#f0f4fa;border-color:#c8d6e5;color:#1a2a3f;}
        .input-group .angle-inputs input:focus{border-color:#1abc9c;}
        .input-group .angle-inputs .deg-sep{color:#8ba5b8;font-size:0.9rem;font-weight:600;padding:0 2px;}
        :root.light-mode .input-group .angle-inputs .deg-sep{color:#4a6a8a;}
        .input-group select{flex:1;min-width:80px;padding:10px 12px;background:#1e3545;border:1px solid rgba(46,204,113,0.15);border-radius:10px;font-size:0.95rem;color:#fff;outline:none;cursor:pointer;transition:0.3s;}
        :root.light-mode .input-group select{background:#f0f4fa;border-color:#c8d6e5;color:#1a2a3f;}
        .input-group select:focus{border-color:#1abc9c;}
        .input-group select option{background:#1e3545;color:#fff;}
        :root.light-mode .input-group select option{background:#f0f4fa;color:#1a2a3f;}

        .visual-block{background:#1a2d3c;border-radius:14px;padding:12px 18px;text-align:center;border:1px solid rgba(46,204,113,0.08);margin-bottom:12px;transition:0.3s;}
        :root.light-mode .visual-block{background:#e8edf6;border-color:#c8d6e5;}
        .visual-block .vis-label{color:#8ba5b8;font-size:0.7rem;margin-bottom:2px;text-transform:uppercase;letter-spacing:1px;}
        :root.light-mode .visual-block .vis-label{color:#4a6a8a;}
        .visual-block .vis-formula{font-size:1.8rem;font-weight:700;color:#fff;min-height:45px;display:flex;align-items:center;justify-content:center;}
        :root.light-mode .visual-block .vis-formula{color:#1a2a3f;}
        .visual-block .vis-formula mjx-container{font-size:1.8rem !important;display:inline-block !important;}

        .btn{width:100%;padding:12px;background:#1abc9c;color:#fff;border:none;border-radius:40px;font-size:1rem;font-weight:600;cursor:pointer;transition:all 0.3s;margin-bottom:12px;}
        .btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(26,188,156,0.3);background:#16a085;}
        .btn:active{transform:scale(0.97);}
        .btn-clear{padding:6px 16px;background:#e74c3c;color:#fff;border:none;border-radius:16px;font-size:0.7rem;font-weight:600;cursor:pointer;transition:0.3s;}
        .btn-clear:hover{background:#c0392b;}

        .result{background:#1a2d3c;border-radius:16px;padding:16px;text-align:center;border:1px solid rgba(46,204,113,0.08);transition:0.3s;}
        :root.light-mode .result{background:#e8edf6;border-color:#c8d6e5;}
        .result .label{color:#8ba5b8;font-size:0.8rem;margin-bottom:4px;}
        :root.light-mode .result .label{color:#4a6a8a;}
        .result .value{font-size:2rem;font-weight:700;font-family:'Courier New',monospace;}
        .result .value.sin{color:#34d399;}
        .result .value.cos{color:#60a5fa;}
        .result .value.tg{color:#fbbf24;}
        .result .value.ctg{color:#f87171;}
        .result .value mjx-container{font-size:2rem !important;}

        .extra-info{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
        .extra-info .info-item{background:#1a2d3c;border-radius:12px;padding:14px 12px;text-align:center;border:1px solid rgba(46,204,113,0.05);transition:0.3s;}
        :root.light-mode .extra-info .info-item{background:#eef2f8;border-color:#c8d6e5;}
        .extra-info .info-item .info-label{color:#8ba5b8;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.5px;}
        :root.light-mode .extra-info .info-item .info-label{color:#4a6a8a;}
        .extra-info .info-item .info-value{color:#fff;font-weight:700;font-size:1.2rem;margin-top:4px;}
        :root.light-mode .extra-info .info-item .info-value{color:#1a2a3f;}
        .extra-info .info-item .info-value mjx-container{font-size:1.2rem !important;display:inline-block !important;}

        .history-header{display:flex;justify-content:space-between;align-items:center;margin-top:12px;}
        .history-header .h-title{color:#8ba5b8;font-size:0.8rem;}
        :root.light-mode .history-header .h-title{color:#4a6a8a;}
        .history{background:#1a2d3c;border-radius:12px;padding:10px;margin-top:4px;border:1px solid rgba(46,204,113,0.05);max-height:120px;overflow-y:auto;transition:0.3s;}
        :root.light-mode .history{background:#e8edf6;border-color:#c8d6e5;}
        .history .h-item{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid rgba(46,204,113,0.05);color:#8ba5b8;font-size:0.8rem;}
        :root.light-mode .history .h-item{color:#4a6a8a;border-bottom-color:#c8d6e5;}
        .history .h-item:last-child{border-bottom:none;}
        .history .h-item .h-val{color:#fff;font-weight:600;}
        :root.light-mode .history .h-item .h-val{color:#1a2a3f;}
        .history .h-item .h-val mjx-container{font-size:0.8rem !important;}
        .history::-webkit-scrollbar{width:3px;}
        .history::-webkit-scrollbar-track{background:#1a2d3c;}
        :root.light-mode .history::-webkit-scrollbar-track{background:#e8edf6;}
        .history::-webkit-scrollbar-thumb{background:#1abc9c;border-radius:3px;}
        .history-empty{color:#5a7a94;text-align:center;padding:8px 0;font-size:0.8rem;}
        :root.light-mode .history-empty{color:#6a8aaa;}

        .inverse-section{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center;}
        .inverse-section select{flex:1;min-width:80px;padding:8px 10px;background:#1e3545;border:1px solid rgba(46,204,113,0.15);border-radius:8px;font-size:0.85rem;color:#fff;outline:none;cursor:pointer;transition:0.3s;}
        :root.light-mode .inverse-section select{background:#f0f4fa;border-color:#c8d6e5;color:#1a2a3f;}
        .inverse-section input{flex:1;min-width:60px;padding:8px 10px;background:#1e3545;border:1px solid rgba(46,204,113,0.15);border-radius:8px;font-size:0.85rem;color:#fff;text-align:center;outline:none;transition:0.3s;}
        :root.light-mode .inverse-section input{background:#f0f4fa;border-color:#c8d6e5;color:#1a2a3f;}
        .inverse-section .btn-small{padding:8px 16px;background:#2a4a5a;color:#fff;border:none;border-radius:20px;font-size:0.8rem;cursor:pointer;transition:0.3s;}
        :root.light-mode .inverse-section .btn-small{background:#d0d9e8;color:#1a2a3f;}
        .inverse-section .btn-small:hover{background:#3a5a6a;}
        :root.light-mode .inverse-section .btn-small:hover{background:#c0c9d8;}
        .inverse-result{color:#60a5fa;font-weight:600;font-size:1.1rem;min-width:80px;text-align:center;}

        .back-link{display:block;text-align:center;margin-top:14px;padding:12px;background:#1e3545;border-radius:14px;color:#8ba5b8;text-decoration:none;font-size:0.85rem;transition:0.3s;border:1px solid rgba(46,204,113,0.1);font-weight:500;}
        :root.light-mode .back-link{background:#e8edf6;color:#4a6a8a;border-color:#c8d6e5;}
        .back-link:hover{background:#2a4a5a;color:#fff;}
        :root.light-mode .back-link:hover{background:#d0d9e8;color:#1a2a3f;}

        @media(max-width:500px){.wrapper{padding:16px;}.header-block .section-title{font-size:1.2rem;padding:12px 16px;}.header-block .section-title .sub-title{font-size:0.75rem;}.input-group .angle-inputs input{padding:6px 4px;font-size:0.8rem;min-width:30px;}.input-group select{padding:6px 10px;font-size:0.8rem;}.result .value{font-size:1.6rem;}.extra-info{grid-template-columns:1fr 1fr;gap:6px;}.extra-info .info-item{padding:10px 8px;}.extra-info .info-item .info-value{font-size:1rem;}.extra-info .info-item .info-value mjx-container{font-size:1rem !important;}.visual-block .vis-formula{font-size:1.3rem;}}
    </style>
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true,
                macros: { tg: '\\mathop{\\mathrm{tg}}', ctg: '\\mathop{\\mathrm{ctg}}' }
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
                ignoreHtmlClass: 'no-mathjax'
            },
            chtml: { scale: 1.0, displayAlign: 'center' }
        };
    </script>
    <script src="mathjax/es5/tex-chtml.js" id="MathJax-script" async></script>
</head>
<body>

<div class="header-block">
    <div class="section-title">
        <span class="main-title">📐 Таблица Брадиса</span>
        <span class="sub-title">Введите угол (градусы · минуты · секунды)</span>
    </div>
</div>

<div class="wrapper">
    <div class="input-group">
        <div class="angle-inputs">
            <input type="number" id="degInput" value="75" min="0" max="360" step="1">
            <span class="deg-sep">°</span>
            <input type="number" id="minInput" value="0" min="0" max="59" step="1">
            <span class="deg-sep">′</span>
            <input type="number" id="secInput" value="0" min="0" max="59" step="1">
            <span class="deg-sep">″</span>
        </div>
        <select id="funcSelect">
            <option value="sin">sin</option>
            <option value="cos" selected>cos</option>
            <option value="tg">tg</option>
            <option value="ctg">ctg</option>
        </select>
    </div>

    <div class="visual-block">
        <div class="vis-label">Вычисляется</div>
        <div class="vis-formula" id="visFormula">\(\cos(75^{\circ})\)</div>
    </div>

    <button class="btn" onclick="calculate(true)">🧮 ВЫЧИСЛИТЬ</button>

    <div class="result">
        <div class="label" id="resultLabel">\(\cos(75^{\circ})\)</div>
        <div class="value cos" id="resultValue">0.2588190451</div>
    </div>

    <div class="extra-info">
        <div class="info-item">
            <div class="info-label">В радианах</div>
            <div class="info-value" id="infoRadians">\(\frac{5\pi}{12}\)</div>
        </div>
        <div class="info-item">
            <div class="info-label">Точное значение</div>
            <div class="info-value" id="infoExact">\(\frac{\sqrt{6}-\sqrt{2}}{4}\)</div>
        </div>
    </div>

    <div class="inverse-section">
        <select id="invFunc">
            <option value="arcsin">arcsin</option>
            <option value="arccos" selected>arccos</option>
            <option value="arctg">arctg</option>
            <option value="arcctg">arcctg</option>
        </select>
        <input type="number" id="invValue" value="0.2588" step="0.001" min="-1" max="1">
        <button class="btn-small" onclick="calcInverse()">Найти угол</button>
        <span class="inverse-result" id="invResult">75°</span>
    </div>

    <div class="history-header">
        <span class="h-title">История</span>
        <button class="btn-clear" onclick="clearHistory()">Очистить</button>
    </div>
    <div class="history" id="historyBlock">
        <div class="history-empty">История пуста</div>
    </div>

    <a href="index.html" class="back-link">Назад</a>
</div>

<script>
    function getTotalDegrees() {
        const d = parseFloat(document.getElementById('degInput').value) || 0;
        const m = parseFloat(document.getElementById('minInput').value) || 0;
        const s = parseFloat(document.getElementById('secInput').value) || 0;
        return d + m / 60 + s / 3600;
    }

    function toRadians(deg) {
        return deg * Math.PI / 180;
    }

    function formatAngleLatex(deg, min, sec) {
        if (min === 0 && sec === 0) {
            return deg + '^{\\circ}';
        }
        if (sec === 0) {
            return deg + '^{\\circ}' + min + "'";
        }
        return deg + '^{\\circ}' + min + "'" + sec + "''";
    }

    function getExactValue(func, deg) {
        const d = ((deg % 360) + 360) % 360;
        const table = {
            sin: {
                0: '0', 30: '\\frac{1}{2}', 45: '\\frac{\\sqrt{2}}{2}', 60: '\\frac{\\sqrt{3}}{2}', 90: '1',
                120: '\\frac{\\sqrt{3}}{2}', 135: '\\frac{\\sqrt{2}}{2}', 150: '\\frac{1}{2}', 180: '0',
                210: '-\\frac{1}{2}', 225: '-\\frac{\\sqrt{2}}{2}', 240: '-\\frac{\\sqrt{3}}{2}', 270: '-1',
                300: '-\\frac{\\sqrt{3}}{2}', 315: '-\\frac{\\sqrt{2}}{2}', 330: '-\\frac{1}{2}', 360: '0',
                15: '\\frac{\\sqrt{6}-\\sqrt{2}}{4}', 75: '\\frac{\\sqrt{6}+\\sqrt{2}}{4}'
            },
            cos: {
                0: '1', 30: '\\frac{\\sqrt{3}}{2}', 45: '\\frac{\\sqrt{2}}{2}', 60: '\\frac{1}{2}', 90: '0',
                120: '-\\frac{1}{2}', 135: '-\\frac{\\sqrt{2}}{2}', 150: '-\\frac{\\sqrt{3}}{2}', 180: '-1',
                210: '-\\frac{\\sqrt{3}}{2}', 225: '-\\frac{\\sqrt{2}}{2}', 240: '-\\frac{1}{2}', 270: '0',
                300: '\\frac{1}{2}', 315: '\\frac{\\sqrt{2}}{2}', 330: '\\frac{\\sqrt{3}}{2}', 360: '1',
                15: '\\frac{\\sqrt{6}+\\sqrt{2}}{4}', 75: '\\frac{\\sqrt{6}-\\sqrt{2}}{4}'
            },
            tg: {
                0: '0', 30: '\\frac{1}{\\sqrt{3}}', 45: '1', 60: '\\sqrt{3}', 90: '\\text{не сущ.}',
                120: '-\\sqrt{3}', 135: '-1', 150: '-\\frac{1}{\\sqrt{3}}', 180: '0',
                210: '\\frac{1}{\\sqrt{3}}', 225: '1', 240: '\\sqrt{3}', 270: '\\text{не сущ.}',
                300: '-\\sqrt{3}', 315: '-1', 330: '-\\frac{1}{\\sqrt{3}}', 360: '0'
            },
            ctg: {
                0: '\\text{не сущ.}', 30: '\\sqrt{3}', 45: '1', 60: '\\frac{1}{\\sqrt{3}}', 90: '0',
                120: '-\\frac{1}{\\sqrt{3}}', 135: '-1', 150: '-\\sqrt{3}', 180: '\\text{не сущ.}',
                210: '\\sqrt{3}', 225: '1', 240: '\\frac{1}{\\sqrt{3}}', 270: '0',
                300: '-\\frac{1}{\\sqrt{3}}', 315: '-1', 330: '-\\sqrt{3}', 360: '\\text{не сущ.}'
            }
        };
        if (table[func] && table[func][d] !== undefined) return table[func][d];
        return null;
    }

    function radiansToLatex(deg) {
        const d = ((deg % 360) + 360) % 360;
        const table = {
            0: '0', 15: '\\frac{\\pi}{12}', 30: '\\frac{\\pi}{6}', 45: '\\frac{\\pi}{4}', 60: '\\frac{\\pi}{3}',
            75: '\\frac{5\\pi}{12}', 90: '\\frac{\\pi}{2}', 120: '\\frac{2\\pi}{3}', 135: '\\frac{3\\pi}{4}',
            150: '\\frac{5\\pi}{6}', 180: '\\pi', 210: '\\frac{7\\pi}{6}', 225: '\\frac{5\\pi}{4}',
            240: '\\frac{4\\pi}{3}', 270: '\\frac{3\\pi}{2}', 300: '\\frac{5\\pi}{3}', 315: '\\frac{7\\pi}{4}',
            330: '\\frac{11\\pi}{6}', 360: '2\\pi'
        };
        if (table[d] !== undefined) return table[d];
        return (toRadians(deg)).toFixed(6);
    }

    function calculate(addToHistoryFlag) {
        const deg = parseFloat(document.getElementById('degInput').value) || 0;
        const min = parseFloat(document.getElementById('minInput').value) || 0;
        const sec = parseFloat(document.getElementById('secInput').value) || 0;
        const func = document.getElementById('funcSelect').value;

        const totalDeg = deg + min / 60 + sec / 3600;
        const rad = toRadians(totalDeg);

        const dNorm = ((totalDeg % 360) + 360) % 360;
        const isSpecial = (min === 0 && sec === 0) &&
            (dNorm === 0 || dNorm === 30 || dNorm === 45 || dNorm === 60 || dNorm === 90 ||
             dNorm === 120 || dNorm === 135 || dNorm === 150 || dNorm === 180 ||
             dNorm === 210 || dNorm === 225 || dNorm === 240 || dNorm === 270 ||
             dNorm === 300 || dNorm === 315 || dNorm === 330 || dNorm === 15 || dNorm === 75);

        let value;
        try {
            switch (func) {
                case 'sin': value = Math.sin(rad); break;
                case 'cos': value = Math.cos(rad); break;
                case 'tg':
                    if (Math.abs(Math.cos(rad)) < 1e-12) value = Infinity;
                    else value = Math.tan(rad);
                    break;
                case 'ctg':
                    if (Math.abs(Math.sin(rad)) < 1e-12) value = Infinity;
                    else value = 1 / Math.tan(rad);
                    break;
            }
        } catch(e) {
            value = NaN;
        }

        const angleLatex = formatAngleLatex(deg, min, sec);
        const funcFull = func === 'tg' ? '\\tg' : (func === 'ctg' ? '\\ctg' : '\\' + func);
        const exprLatex = funcFull + '(' + angleLatex + ')';

        document.getElementById('visFormula').innerHTML = '\\(' + exprLatex + '\\)';
        document.getElementById('resultLabel').innerHTML = '\\(' + exprLatex + '\\)';

        const resultEl = document.getElementById('resultValue');
        resultEl.className = 'value ' + func;

        if (!isFinite(value) || isNaN(value)) {
            resultEl.textContent = 'не существует';
            resultEl.style.fontSize = '1.3rem';
        } else {
            resultEl.style.fontSize = '';
            let str = value.toFixed(10);
            str = str.replace(/\.?0+$/, '');
            resultEl.textContent = str;
        }

        document.getElementById('infoRadians').innerHTML = '\\(' + radiansToLatex(totalDeg) + '\\)';

        let exactLatex = '\\text{—}';
        if (isSpecial) {
            const exact = getExactValue(func, dNorm);
            if (exact !== null) exactLatex = exact;
        }
        document.getElementById('infoExact').innerHTML = '\\(' + exactLatex + '\\)';

        if (window.MathJax) {
            if (typeof MathJax.typesetPromise === 'function') {
                MathJax.typesetPromise();
            } else if (typeof MathJax.typeset === 'function') {
                MathJax.typeset();
            }
        }

        if (addToHistoryFlag) {
            addToHistory(exprLatex, isFinite(value) ? value : 'не сущ.');
        }
    }

    function calcInverse() {
        const func = document.getElementById('invFunc').value;
        const val = parseFloat(document.getElementById('invValue').value);
        const out = document.getElementById('invResult');

        if (isNaN(val)) { out.textContent = '—'; return; }

        let rad, deg;
        try {
            switch (func) {
                case 'arcsin':
                    if (val < -1 || val > 1) { out.textContent = 'вне [-1;1]'; return; }
                    rad = Math.asin(val);
                    break;
                case 'arccos':
                    if (val < -1 || val > 1) { out.textContent = 'вне [-1;1]'; return; }
                    rad = Math.acos(val);
                    break;
                case 'arctg':
                    rad = Math.atan(val);
                    break;
                case 'arcctg':
                    rad = Math.PI / 2 - Math.atan(val);
                    break;
            }
            deg = rad * 180 / Math.PI;
        } catch(e) {
            out.textContent = 'ошибка';
            return;
        }

        const d = Math.floor(deg);
        const mFull = (deg - d) * 60;
        const m = Math.floor(mFull);
        const s = Math.round((mFull - m) * 60);

        let resultStr = d + '°';
        if (m > 0 || s > 0) resultStr += ' ' + m + "'";
        if (s > 0) resultStr += ' ' + s + '"';
        out.textContent = resultStr;
    }

    let history = [];
    const HISTORY_KEY = 'bradis_history';

    function loadHistory() {
        try {
            const saved = localStorage.getItem(HISTORY_KEY);
            if (saved) history = JSON.parse(saved);
        } catch(e) { history = []; }
        renderHistory();
    }

    function saveHistory() {
        try {
            localStorage.setItem(HISTORY_KEY, JSON.stringify(history.slice(-20)));
        } catch(e) {}
    }

    function addToHistory(exprLatex, value) {
        const valueStr = typeof value === 'number'
            ? value.toFixed(10).replace(/\.?0+$/, '')
            : String(value);
        history.unshift({ expr: exprLatex, value: valueStr });
        if (history.length > 20) history.pop();
        saveHistory();
        renderHistory();
    }

    function renderHistory() {
        const block = document.getElementById('historyBlock');
        if (history.length === 0) {
            block.innerHTML = '<div class="history-empty">История пуста</div>';
            return;
        }
        let html = '';
        for (const h of history) {
            html += '<div class="h-item"><span>\\(' + h.expr + '\\)</span><span class="h-val">' + h.value + '</span></div>';
        }
        block.innerHTML = html;
        if (window.MathJax) {
            if (typeof MathJax.typesetPromise === 'function') {
                MathJax.typesetPromise([block]);
            } else if (typeof MathJax.typeset === 'function') {
                MathJax.typeset([block]);
            }
        }
    }

    function clearHistory() {
        history = [];
        saveHistory();
        renderHistory();
    }

    (function() {
        if (localStorage.getItem('mathTheme') === 'light') {
            document.documentElement.classList.add('light-mode');
            const __btn = document.getElementById('themeBtn');
            if (__btn) __btn.textContent = '☀️';
        }
    })();

    // Перетипизация MathJax при смене темы — чтобы формулы не остались в старых цветах
    new MutationObserver(function(mutations) {
        mutations.forEach(function(m) {
            if (m.attributeName === 'class') {
                if (window.MathJax && typeof MathJax.typesetPromise === 'function') {
                    MathJax.typesetPromise();
                }
            }
        });
    }).observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });

    document.getElementById('funcSelect').addEventListener('change', function() { calculate(false); });
    document.getElementById('degInput').addEventListener('input', function() { calculate(false); });
    document.getElementById('minInput').addEventListener('input', function() { calculate(false); });
    document.getElementById('secInput').addEventListener('input', function() { calculate(false); });

    window.addEventListener('load', function() {
        loadHistory();
        calculate(false);
        setTimeout(function() {
            if (window.MathJax && typeof MathJax.typesetPromise === 'function') {
                MathJax.typesetPromise();
            }
        }, 200);
    });
</script>

<script src="favorites.js"></script>
<script src="theme.js"></script>
</body>
</html>
