<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <title>Поиск и избранное</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #1a2d3c;
            --card-bg: #1e3545;
            --text: #ffffff;
            --text-secondary: #8ba5b8;
            --accent: #1abc9c;
            --border: rgba(46, 204, 113, 0.1);
            --header-bg: linear-gradient(135deg, #1e3545, #162a38);
            --menu-card-bg: #1e3545;
            --menu-item-bg: #1e3545;
            --menu-item-hover: #233e50;
        }

        :root.light-mode {
            --bg: linear-gradient(145deg, #f5f7fc 0%, #eef2f8 100%);
            --card-bg: white;
            --text: #1a2a3f;
            --text-secondary: #6a7e9c;
            --accent: #1abc9c;
            --border: #eff3f8;
            --header-bg: linear-gradient(135deg, #ffffff, #f8fafc);
            --menu-card-bg: white;
            --menu-item-bg: white;
            --menu-item-hover: linear-gradient(95deg, #f8fafd, #ffffff);
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            padding-top: 60px;
        }

        .favorite-toggle {
            position: absolute;
            top: 12px;
            left: 60px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--card-bg);
            border: 1px solid var(--border);
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            color: var(--text-secondary);
            transition: all 0.2s;
        }
        .favorite-toggle:hover { transform: scale(1.1); }

        .header {
            text-align: center;
            margin-bottom: 24px;
            padding: 20px;
            background: var(--header-bg);
            border-radius: 32px;
            border: 1px solid rgba(0,0,0,0.04);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 6px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.8rem;
        }

        /* Поисковая строка */
        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            padding: 14px 18px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 40px;
            font-size: 1rem;
            color: var(--text);
            outline: none;
        }

        .search-input:focus {
            border-color: var(--accent);
        }

        .search-btn, .clear-btn {
            padding: 14px 24px;
            background: var(--accent);
            border: none;
            border-radius: 40px;
            color: white;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .clear-btn {
            background: var(--menu-item-bg);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .clear-btn:hover, .search-btn:hover {
            transform: translateY(-2px);
        }

        /* Категории */
        .category-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }

        .category-btn {
            padding: 8px 16px;
            background: var(--menu-item-bg);
            border: 1px solid var(--border);
            border-radius: 30px;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        .category-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .category-btn:hover {
            background: var(--menu-item-hover);
        }

        /* Табы */
        .tabs {
            display: flex;
            gap: 0;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .tab {
            padding: 12px 24px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.2s;
            position: relative;
        }

        .tab.active {
            color: var(--accent);
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--accent);
        }

        /* Результаты */
        .results-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .result-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 16px 20px;
            border: 1px solid var(--border);
            transition: all 0.2s;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .result-card:hover {
            transform: translateX(5px);
            background: var(--menu-item-hover);
        }

        .result-icon {
            font-size: 32px;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--info-bg);
            border-radius: 16px;
        }

        .result-content {
            flex: 1;
        }

        .result-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 4px;
        }

        .result-category {
            font-size: 0.7rem;
            color: var(--accent);
            margin-bottom: 4px;
        }

        .result-description {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .result-fav {
            font-size: 24px;
            cursor: pointer;
            padding: 8px;
            transition: all 0.2s;
        }

        .result-fav:hover {
            transform: scale(1.1);
        }

        .result-fav.fav-active {
            color: #facc15;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .history-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }

        .history-item {
            padding: 6px 14px;
            background: var(--menu-item-bg);
            border-radius: 30px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .history-item:hover {
            background: var(--accent);
            color: white;
        }

        .back-link {
            display: inline-block;
            margin-top: 24px;
            padding: 10px 24px;
            background: var(--accent);
            color: white;
            text-decoration: none;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            text-align: center;
        }

        @media (max-width: 550px) {
            body { padding: 12px; }
            .result-card { flex-wrap: wrap; }
            .result-icon { width: 40px; height: 40px; font-size: 24px; }
            .search-bar { flex-direction: column; }
            .search-btn, .clear-btn { padding: 12px; }
        }
    
/* ===== Убираем прямоугольную подсветку кнопок, оставляем форму ===== */
button, .btn, .mode-btn, .angle-btn, .diff-btn, .history-clear,
[class*="btn"], [class*="button"] {
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-appearance: none;
    appearance: none;
    outline: none;
}
/* ===== Убираем прямоугольную подсветку для ссылок и селектов ===== */
a, select, option, input, textarea,
.back-link, .contact-link {
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    outline: none;
}

select:focus, a:focus, input:focus, textarea:focus {
    outline: none;
}








/* ===== ФИНАЛЬНЫЙ ФИКС: центрирование заголовков и градиент ===== */
.section-title {
    display: flex !important;
    flex-direction: column !important; /* Элементы друг под другом */
    align-items: center !important;    /* Центрируем по горизонтали */
    justify-content: center !important;
    text-align: center !important;
    position: relative !important;
    padding: 8px 40px !important; /* Отступы по бокам (40px справа для стрелки) */
    margin-bottom: 8px !important;
    border-left: 4px solid var(--special-border, #3b82f6) !important;
    background: transparent !important;
    border-radius: 0 12px 12px 0 !important;
    transition: background 0.3s ease, color 0.2s ease !important;
    box-shadow: none !important; /* Убираем свечение */
}

/* Наведение: градиентный фон */
.section-title:hover {
    background: linear-gradient(90deg, 
        var(--special-border, #3b82f6) 0%, 
        rgba(13, 148, 136, 0.15) 30%, 
        rgba(13, 148, 136, 0.05) 100%) !important;
}
.section-title:active {
    background: linear-gradient(90deg, 
        var(--special-border, #3b82f6) 0%, 
        rgba(13, 148, 136, 0.25) 30%, 
        rgba(13, 148, 136, 0.1) 100%) !important;
}

/* Псевдоэлемент ::before больше не нужен, скрываем */
.section-title::before {
    display: none !important;
}

/* Центрируем внутренние элементы (заголовок и подзаголовок) */
.section-title .main-title,
.section-title > span:not(.sub-title) {
    display: block !important;
    width: 100% !important;
    text-align: center !important;
    justify-content: center !important;
    font-size: 1.1rem !important;
    margin: 0 !important;
}

.section-title .sub-title {
    display: block !important;
    width: 100% !important;
    text-align: center !important;
    font-size: 0.85rem !important;
    color: var(--text-secondary) !important;
    margin-top: 4px !important;
}

/* Стрелка ▼ строго справа по центру высоты */
.section-title::after {
    position: absolute !important;
    right: 16px !important;
    top: 50% !important;
    transform: translateY(-50%) !important;
    margin: 0 !important;
}
.section.collapsed .section-title::after {
    transform: translateY(-50%) rotate(-90deg) !important;
}
/* ===== Парение, тень и градиент для карточек ===== */
.example, .formula-block, .theorem-text, .important, .interval-card, .def-card, .note-box, .task-block, .task-condition, .task-given-find {
    position: relative !important;
    border-radius: 16px !important;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12) !important;
    transition: transform 0.2s ease, box-shadow 0.2s ease !important;
    border-left: none !important;
    padding-left: 20px !important;
    background-color: var(--example-bg, var(--formula-bg, var(--info-bg, #162a38))) !important;
    margin-bottom: 16px !important;
}

/* Градиентная полоска слева */
.example::before, .formula-block::before, .theorem-text::before, .important::before, .interval-card::before, .def-card::before, .note-box::before, .task-block::before, .task-condition::before, .task-given-find::before {
    content: "" !important;
    position: absolute !important;
    left: 0 !important;
    top: 0 !important;
    bottom: 0 !important;
    width: 5px !important;
    background: linear-gradient(180deg, var(--special-border, #ef4444) 0%, #0d9488 100%) !important;
    border-radius: 16px 0 0 16px !important;
    z-index: 1 !important;
}

/* Эффект парения при наведении (только на ПК) */
@media (hover: hover) {
    .example:hover, .formula-block:hover, .theorem-text:hover, .important:hover, .interval-card:hover, .def-card:hover, .note-box:hover, .task-block:hover, .task-condition:hover, .task-given-find:hover {
        transform: translateY(-3px) !important;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2) !important;
    }
}
/* ===== Жесткое центрирование кнопки Назад ===== */
a.back-link, .back-link {
    display: table !important;       /* Сжимает по ширине текста и позволяет margin: auto */
    margin-left: auto !important;    /* Центрирование по горизонтали */
    margin-right: auto !important;
    margin-top: 20px !important;     /* Отступ сверху */
    margin-bottom: 10px !important;  /* Отступ снизу */
    text-align: center !important;
    float: none !important;          /* На случай, если есть float */
}</style>

<style id="bottom-nav-autohide">
/* Автоскрытие нижней панели при скролле вниз */

<style id="math-nav-animation">
/* Плавная анимация кнопок нижней панели (как в физике) */
.bottom-nav a,
.bottom-nav button {
    transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1),
                background 0.2s ease,

}

.bottom-nav a:hover,
.bottom-nav button:hover {
    transform: translateY(-3px) scale(1.08) !important;
}

.bottom-nav a:active,
.bottom-nav button:active {
    transform: translateY(0) scale(0.92) !important;
}

/* Желтая кнопка избранного - тоже пружинит */
.bottom-nav a[href="favorites.html"].active {
    background: rgba(250, 204, 21, 0.20) !important;
    color: #facc15 !important;
    transform: translateY(-3px) scale(1.08) !important;
}

/* Ripple-эффект при нажатии (появление волны) */
.ripple-host {
    position: relative !important;
    overflow: hidden !important;
}
.ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(26, 188, 156, 0.35); /* Зеленоватый акцент для математики */
    transform: scale(0);
    animation: rippleAnim 0.6s ease-out forwards;
    pointer-events: none;
    z-index: 0;
}
@keyframes rippleAnim {
    to { transform: scale(2.5); opacity: 0; }
}
</style>

    // ==== ЗАГРУЗКА ДАННЫХ ====
    async function loadPagesData() {
        try {
            const response = await fetch('data/pages.json');
            if (response.ok) {
                pagesData = await response.json();
                console.log('✅ pages.json загружен успешно');
            } else {
                console.warn('⚠️ pages.json не найден, используем встроенные данные');
                pagesData = FALLBACK_DATA;
            }
        } catch (error) {
            console.warn('⚠️ Ошибка загрузки pages.json, используем встроенные данные:', error);
            pagesData = FALLBACK_DATA;
        }
        initCategoryFilters();
        loadHistory();
        // Если есть параметр поиска в URL
        const urlParams = new URLSearchParams(window.location.search);
        const query = urlParams.get('q');
        if (query) {
            document.getElementById('searchInput').value = query;
            performSearch();
        }
        // Показываем все страницы при загрузке
        performSearch();
    }

    // Инициализация фильтров категорий
    function initCategoryFilters() {
        const categories = [...new Set(pagesData.map(p => p.category))];
        const container = document.getElementById('categoryFilters');
        container.innerHTML = `
            <button class="category-btn active" data-category="all" onclick="setCategory('all')">Все</button>
            ${categories.map(cat => `<button class="category-btn" data-category="${cat}" onclick="setCategory('${cat}')">${cat}</button>`).join('')}
        `;
    }

    // Установка категории
    function setCategory(category) {
        currentCategory = category;
        document.querySelectorAll('.category-btn').forEach(btn => {
            btn.classList.remove('active');
            if (btn.dataset.category === category) btn.classList.add('active');
        });
        if (currentTab === 'search') {
            performSearch();
        } else {
            showFavorites();
        }
    }

    // Переключение табов
    function switchTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelector(`.tab[data-tab="${tab}"]`).classList.add('active');

        if (tab === 'search') {
            performSearch();
        } else {
            showFavorites();
        }
    }

    // Сохранение истории поиска
    function saveHistory() {
        localStorage.setItem(HISTORY_KEY, JSON.stringify(searchHistory.slice(0, 10)));
    }

    function loadHistory() {
        const saved = localStorage.getItem(HISTORY_KEY);
        if (saved) {
            try {
                searchHistory = JSON.parse(saved);
            } catch(e) { searchHistory = []; }
        }
        renderHistory();
    }

    function addToHistory(query) {
        if (!query.trim()) return;
        query = query.toLowerCase().trim();
        searchHistory = searchHistory.filter(h => h !== query);
        searchHistory.unshift(query);
        if (searchHistory.length > 10) searchHistory.pop();
        saveHistory();
        renderHistory();
    }

    function clearHistory() {
        searchHistory = [];
        saveHistory();
        renderHistory();
    }

    function renderHistory() {
        const container = document.getElementById('historyList');
        if (!container) return;
        if (searchHistory.length === 0) {
            container.innerHTML = '<span style="color: var(--text-secondary); font-size: 0.7rem;">Нет истории</span>';
            return;
        }
        container.innerHTML = searchHistory.map(h => `<span class="history-item" onclick="setSearchQuery('${h.replace(/'/g, "\\'")}')">${h}</span>`).join('');
    }

    function setSearchQuery(query) {
        document.getElementById('searchInput').value = query;
        performSearch();
    }

    // Поиск
    function performSearch() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();

        if (query) {
            addToHistory(query);
        }

        let results = pagesData;

        // Фильтр по категории
        if (currentCategory !== 'all') {
            results = results.filter(p => p.category === currentCategory);
        }

        // Поиск по запросу
        if (query) {
            results = results.filter(page => {
                // Ищем в названии
                if (page.title.toLowerCase().includes(query)) return true;
                // Ищем в ключевых словах
                if (page.keywords && page.keywords.some(kw => kw.toLowerCase().includes(query))) return true;
                // Ищем в категории
                if (page.category.toLowerCase().includes(query)) return true;
                // Ищем в описании
                if (page.desc && page.desc.toLowerCase().includes(query)) return true;
                return false;
            });
        }

        renderResults(results, query);
    }

    function clearSearch() {
        document.getElementById('searchInput').value = '';
        performSearch();
    }

    // Отображение результатов
    function renderResults(results, query) {
        const container = document.getElementById('resultsContainer');
        const favorites = getFavorites();

        if (results.length === 0) {
            container.innerHTML = '<div class="empty-state">😕 Ничего не найдено</div>';
            return;
        }

        container.innerHTML = results.map(page => `
            <div class="result-card" onclick="openPage('${page.url}')">
                <div class="result-icon">${page.icon || '📄'}</div>
                <div class="result-content">
                    <div class="result-title">${highlightText(page.title, query)}</div>
                    <div class="result-category">${page.category}</div>
                    <div class="result-description">${page.desc || ''}</div>
                </div>
                <div class="result-fav ${favorites.includes(page.url) ? 'fav-active' : ''}"
                     onclick="event.stopPropagation(); toggleFavoriteFromSearch('${page.url}', this)">
                    ${favorites.includes(page.url) ? '★' : '☆'}
                </div>
            </div>
        `).join('');
    }

    // Подсветка текста поиска
    function highlightText(text, query) {
        if (!query) return text;
        const regex = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
        return text.replace(regex, '<mark style="background: var(--accent); color: white; padding: 0 2px; border-radius: 4px;">$1</mark>');
    }

    // Отображение избранного
    function showFavorites() {
        const favorites = getFavorites();
        const container = document.getElementById('resultsContainer');

        if (favorites.length === 0) {
            container.innerHTML = '<div class="empty-state">⭐ Нет избранных страниц. Добавьте их, нажав на звёздочку на любой странице или в результатах поиска.</div>';
            return;
        }

        const favoritePages = pagesData.filter(page => favorites.includes(page.url));

        container.innerHTML = favoritePages.map(page => `
            <div class="result-card" onclick="openPage('${page.url}')">
                <div class="result-icon">${page.icon || '📄'}</div>
                <div class="result-content">
                    <div class="result-title">${page.title}</div>
                    <div class="result-category">${page.category}</div>
                    <div class="result-description">${page.desc || ''}</div>
                </div>
                <div class="result-fav fav-active" onclick="event.stopPropagation(); toggleFavoriteFromSearch('${page.url}', this)">
                    ★
                </div>
            </div>
        `).join('');
    }

    // Переключение избранного из результатов поиска
    function toggleFavoriteFromSearch(url, element) {
        const isFav = toggleFavorite(url);
        if (element) {
            element.textContent = isFav ? '★' : '☆';
            if (isFav) {
                element.classList.add('fav-active');
            } else {
                element.classList.remove('fav-active');
            }
        }
        if (currentTab === 'favorites') {
            showFavorites();
        }
    }

    // Переключение избранного для текущей страницы
    function toggleFavoriteCurrent() {
        const currentUrl = window.location.pathname.split('/').pop();
        toggleFavorite(currentUrl);
        updateFavoriteButton();
    }

    // Открытие страницы
    function openPage(url) {
        window.location.href = url;
    }

    // Переключение темы
        if (currentTab === 'search') {
            performSearch();
        } else {
            showFavorites();
        }
    }

    // Инициализация
    (function init() {
        if (localStorage.getItem('mathTheme') === 'light') {
            document.documentElement.classList.add('light-mode');
            const __btn = document.getElementById('themeBtn'); if (__btn) __btn.textContent = '☀️';
        }
        loadPagesData();
    })();
</script>

<script id="bottom-nav-autohide-script">
/* Автоскрытие нижней панели при скролле */
(function(){
    var nav = document.querySelector('.bottom-nav');
    if (!nav) return;
    var lastY = window.scrollY;
    var threshold = 8;
    var ticking = false;
    function onScroll(){
        var y = window.scrollY;
        if (Math.abs(y - lastY) < threshold) { ticking = false; return; }
        if (y > lastY && y > 80) {
            nav.classList.add('nav-hidden');
        } else {
            nav.classList.remove('nav-hidden');
        }
        lastY = y;
        ticking = false;
    }
    window.addEventListener('scroll', function(){
        if (!ticking) { requestAnimationFrame(onScroll); ticking = true; }
    }, { passive: true });
})();
</script>

<script id="math-nav-ripple">
/* Добавляем Ripple (волну) при нажатии на кнопки панели */
(function() {
    var els = document.querySelectorAll('.bottom-nav a, .bottom-nav button');
    els.forEach(function(el) {
        if (el.dataset.rippleBound) return;
        el.dataset.rippleBound = '1';
        el.classList.add('ripple-host');
        el.addEventListener('pointerdown', function(e) {
            var rect = el.getBoundingClientRect();
            var size = Math.max(rect.width, rect.height);
            var r = document.createElement('span');
            r.className = 'ripple';
            r.style.width = r.style.height = size + 'px';
            r.style.left = (e.clientX - rect.left - size/2) + 'px';
            r.style.top  = (e.clientY - rect.top  - size/2) + 'px';
            el.appendChild(r);
            setTimeout(function(){ r.remove(); }, 650);
        });
    });
})();
</script>
