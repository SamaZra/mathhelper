<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Калькулятор интегралов</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #1a2d3c;
            --card-bg: #1e3545;
            --text: #ffffff;
            --text-secondary: #8ba5b8;
            --border: rgba(16,185,129,0.1);
            --special-border: #8b5cf6;
            --accent: #1abc9c;
            --input-bg: #1a2d3c;
            --result-bg: #162a38;
            --shadow: rgba(0,0,0,0.2);
            --preview-bg: rgba(139,92,246,0.08);
            --hint-bg: rgba(139,92,246,0.06);
            --quick-bg: #162a38;
            --quick-hover: #2a4a5a;
        }

        :root.light-mode {
            --bg: linear-gradient(145deg, #f5f7fc 0%, #eef2f8 100%);
            --card-bg: white;
            --text: #1a2a3f;
            --text-secondary: #4a6a8a;
            --border: #eff3f8;
            --special-border: #7c3aed;
            --accent: #1abc9c;
            --input-bg: #f8fafc;
            --result-bg: #e8f0fe;
            --shadow: rgba(0,0,0,0.08);
            --preview-bg: rgba(139,92,246,0.06);
            --hint-bg: rgba(139,92,246,0.05);
            --quick-bg: #f1f5f9;
            --quick-hover: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: var(--bg);
            padding: 16px;
            margin: 0;
            transition: background 0.3s;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .container { max-width: 820px; width: 100%; margin: 0 auto; background: var(--card-bg); border-radius: 24px; padding: 24px; padding-top: 60px; position: relative; box-shadow: 0 12px 32px var(--shadow); transition: background 0.3s, box-shadow 0.3s; }
        h1 { font-size: 1.6rem; color: var(--text); margin: 0 0 6px 0; text-align: center; }
        .subtitle { color: var(--text-secondary); text-align: center; font-size: 0.9rem; margin-bottom: 20px; }

        label { display: block; font-weight: 600; color: var(--text); margin-bottom: 4px; font-size: 0.95rem; }

        .input-group { margin-bottom: 14px; }
        .input-group .hint { color: var(--text-secondary); font-size: 0.8rem; font-weight: 400; margin-left: 6px; }

        .input-row { display: flex; gap: 12px; flex-wrap: wrap; }
        .input-row .input-group { flex: 1; min-width: 160px; }

        .math-input-wrapper { position: relative; display: flex; flex-direction: column; background: var(--input-bg); border: 1px solid var(--border); border-radius: 14px; padding: 6px 12px; transition: border-color 0.2s; }
        .math-input-wrapper:focus-within { border-color: var(--special-border); }
        .math-input-wrapper .input-row-top { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
        .math-input-wrapper .math-field { flex: 1; padding: 6px 4px; font-size: 1.1rem; background: transparent; border: none; outline: none; color: var(--text); font-family: 'Times New Roman', serif; min-height: 40px; }
        .math-input-wrapper .math-field::placeholder { color: var(--text-secondary); opacity: 0.6; }
        .math-input-wrapper .math-buttons { display: flex; gap: 2px; flex-wrap: wrap; justify-content: flex-end; }
        .math-input-wrapper .math-buttons button { background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 2px 8px; font-size: 0.85rem; cursor: pointer; transition: all 0.15s; font-weight: 600; }
        .math-input-wrapper .math-buttons button:hover { background: var(--special-border); color: white; border-color: var(--special-border); }

        .preview-block {
            margin-top: 6px;
            padding: 8px 12px;
            background: var(--preview-bg);
            border-radius: 10px;
            border-left: 3px solid var(--special-border);
            min-height: 32px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .preview-block .preview-math { font-size: 1.1rem; color: var(--text); flex: 1; min-height: 28px; display: flex; align-items: center; justify-content: center; }
        .preview-block .preview-math mjx-container { font-size: 1.1em !important; color: var(--text) !important; }
        .preview-block .preview-empty { color: var(--text-secondary); font-size: 0.9rem; font-style: italic; opacity: 0.7; }

        .type-toggle { display: flex; gap: 10px; margin-bottom: 18px; }
        .type-btn { flex: 1; padding: 12px; background: var(--input-bg); border: 1px solid var(--border); border-radius: 40px; color: var(--text); font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .type-btn:hover { border-color: var(--special-border); }
        .type-btn.active { background: var(--special-border); color: white; border-color: var(--special-border); }

        .limits-row { display: flex; gap: 16px; margin-top: 8px; }
        .limits-row .input-group { flex: 1; margin-bottom: 0; }
        .limits-row input { width: 100%; padding: 10px 14px; background: var(--input-bg); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 1rem; font-family: 'Times New Roman', serif; outline: none; transition: border-color 0.2s; }
        .limits-row input:focus { border-color: var(--special-border); }
        .pi-hint { font-size: 0.75rem; color: var(--text-secondary); margin-top: 6px; padding-left: 4px; }

        #limitsContainer label { color: var(--text); }

        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0; }
        .btn-calculate { flex: 2; padding: 14px; background: var(--special-border); color: white; border: none; border-radius: 40px; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: all 0.2s; letter-spacing: 0.5px; min-width: 120px; }
        .btn-calculate:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(139,92,246,0.3); background: #6d28d9; }
        .btn-calculate:active { transform: scale(0.97); }
        .btn-hint { flex: 1; padding: 14px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 40px; color: var(--text); font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-hint:hover { border-color: var(--special-border); color: var(--special-border); }

        .hint-block {
            display: none;
            margin-top: 16px;
            background: var(--hint-bg);
            border-left: 4px solid var(--special-border);
            border-radius: 16px;
            padding: 16px;
            transition: all 0.3s ease;
        }
        .hint-block.show { display: block; }
        .hint-title { font-weight: 700; margin-bottom: 8px; color: var(--text); display: flex; align-items: center; gap: 8px; }
        .hint-formula { font-size: 1.1rem; padding: 12px; margin: 8px 0; background: rgba(0,0,0,0.05); border-radius: 12px; overflow-x: auto; min-height: 60px; color: var(--text); }
        .hint-formula mjx-container { color: var(--text) !important; }
        .hint-desc { font-size: 0.9rem; color: var(--text-secondary); margin-top: 8px; line-height: 1.6; }
        .hint-desc mjx-container { color: var(--text) !important; }

        .result-block { margin-top: 16px; padding: 16px 20px; background: var(--result-bg); border-radius: 16px; border-left: 5px solid var(--special-border); display: none; }
        .result-block.visible { display: block; }
        .result-block .label { font-weight: 600; color: var(--text-secondary); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
        .result-block .result-math { font-size: 1.3rem; color: var(--text); padding: 4px 0; overflow-x: auto; }
        .result-block .result-math mjx-container { color: var(--text) !important; }

        .error-message { color: #f87171; margin-top: 12px; text-align: center; font-weight: 600; }

        .back-link { display: inline-block; margin-top: 16px; padding: 10px 20px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 40px; color: var(--text-secondary); text-decoration: none; font-weight: 600; font-size: 0.9rem; transition: all 0.2s; }
        .back-link:hover { background: var(--special-border); color: white; border-color: var(--special-border); transform: translateY(-2px); }

        .quick-btn { padding: 5px 12px; background: var(--quick-bg); border: 1px solid var(--border); border-radius: 18px; color: var(--text); font-size: 0.85rem; font-family: 'Times New Roman', serif; cursor: pointer; transition: all 0.2s; }
        .quick-btn:hover { background: var(--quick-hover); transform: scale(1.03); }
        .quick-btn:active { transform: scale(0.95); }

        .log-input-group { display: flex; gap: 8px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
        .log-input-group input { width: 60px; padding: 6px 10px; font-size: 0.9rem; border-radius: 12px; text-align: center; background: var(--input-bg); border: 1px solid var(--border); color: var(--text); outline: none; }
        .log-input-group span { color: var(--text-secondary); font-size: 0.9rem; }

        @media (max-width: 700px) {
            .container { padding: 16px; padding-top: 56px; }
            h1 { font-size: 1.3rem; }
            .btn-group { flex-direction: column; }
            .limits-row { flex-direction: column; gap: 8px; }
            .quick-btn { font-size: 0.75rem; padding: 4px 10px; }
            .math-input-wrapper .math-buttons button { font-size: 0.75rem; padding: 2px 6px; }
            .result-block .result-math { font-size: 1.1rem; }
        }
    </style>

    <!-- ===== MATHJAX ===== -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true,
                macros: {
                    tg: '\\operatorname{tg}',
                    ctg: '\\operatorname{ctg}'
                }
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
                ignoreHtmlClass: 'no-mathjax'
            },
            chtml: { scale: 1.0, displayAlign: 'center' }
        };
    </script>
    <script src="mathjax/es5/tex-chtml.js" id="MathJax-script" async></script>

    <!-- ===== MATH.JS (как в производных) ===== -->
    <script src="libs/mathjs/math.min.js"></script>

    <!-- ===== ALGEBRITE ===== -->
    <script src="libs/algebrite/algebrite.min.js"></script>
</head>
<body>
<div class="container">
    <h1>🧮 Калькулятор интегралов</h1>
    <div class="subtitle">∫ f(x) dx — для проверки решений</div>

    <!-- ===== ТИП ===== -->
    <div class="type-toggle">
        <button class="type-btn active" id="btnIndefinite" onclick="setType('indefinite')">Неопределённый</button>
        <button class="type-btn" id="btnDefinite" onclick="setType('definite')">Определённый</button>
    </div>

    <!-- ===== ВВОД ФУНКЦИИ ===== -->
    <div class="input-group">
        <label>Функция \(f(x)\)</label>
        <div class="math-input-wrapper">
            <div class="input-row-top">
                <input type="text" id="functionInput" class="math-field" placeholder="например: x^2, sin(x), e^x, 1/x" value="x^2" oninput="updatePreview(); hideHint();">
                <div class="math-buttons">
                    <button onclick="insertFunction('x^2')">x²</button>
                    <button onclick="insertFunction('1/x')">1/x</button>
                    <button onclick="insertFunction('sqrt(x)')">√x</button>
                    <button onclick="insertFunction('sin(x)')">sin</button>
                    <button onclick="insertFunction('cos(x)')">cos</button>
                    <button onclick="insertFunction('tg(x)')">tg</button>
                    <button onclick="insertFunction('ctg(x)')">ctg</button>
                    <button onclick="insertFunction('e^x')">eˣ</button>
                    <button onclick="insertFunction('ln(x)')">ln</button>
                    <button onclick="insertLog()">logₐ</button>
                </div>
            </div>
            <div class="preview-block">
                <span class="preview-math" id="preview">
                    <span class="preview-empty">\( f(x) = x^2 \)</span>
                </span>
            </div>
        </div>

        <div class="log-input-group" id="logGroup" style="display:none;">
            <span>log</span>
            <input type="text" id="logBase" placeholder="a" value="e">
            <span>(x)</span>
            <button class="quick-btn" onclick="insertCustomLog()">Вставить</button>
            <button class="quick-btn" onclick="closeLogInput()">✕</button>
        </div>
    </div>

    <!-- ===== ПРЕДЕЛЫ ===== -->
    <div id="limitsContainer" style="display: none;">
        <label>Пределы интегрирования</label>
        <div class="limits-row">
            <div class="input-group">
                <input type="text" id="lowerLimit" placeholder="Нижний предел a" value="0">
            </div>
            <div class="input-group">
                <input type="text" id="upperLimit" placeholder="Верхний предел b" value="pi">
            </div>
        </div>
        <div class="pi-hint">Подсказка: используйте <b>pi</b> для числа π (например: 2*pi, pi/2)</div>
    </div>

    <!-- ===== КНОПКИ ===== -->
    <div class="btn-group">
        <button class="btn-calculate" onclick="calculateIntegral()">ВЫЧИСЛИТЬ</button>
        <button class="btn-hint" onclick="showFormulaHint()">📖 Подсказка</button>
    </div>

    <!-- ===== ПОДСКАЗКА ===== -->
    <div id="hintBlock" class="hint-block">
        <div class="hint-title">💡 Формула для решения</div>
        <div class="hint-formula" id="hintFormula"></div>
        <div class="hint-desc" id="hintDesc"></div>
    </div>

    <!-- ===== РЕЗУЛЬТАТ ===== -->
    <div class="result-block" id="resultBlock">
        <div class="label">📐 Результат</div>
        <div class="result-math" id="integralResult"></div>
    </div>

    <div id="errorMessage" class="error-message"></div>

    <div style="text-align: center;">
        <a href="javascript:history.back()" class="back-link">← Назад</a>
    </div>
</div>

<script>
    // ================================================================
    // СОСТОЯНИЕ
    // ================================================================
    let currentType = 'indefinite';

    function typesetSafe(nodes) {
        if (!window.MathJax) return;
        try {
            if (typeof MathJax.typesetPromise === 'function') {
                MathJax.typesetPromise(nodes);
            } else if (typeof MathJax.typeset === 'function') {
                MathJax.typeset(nodes);
            }
        } catch (e) {}
    }

    // ================================================================
    // ЛОГАРИФМ
    // ================================================================
    function insertLog() {
        document.getElementById('logGroup').style.display = 'flex';
        document.getElementById('logBase').value = 'e';
        document.getElementById('logBase').focus();
        document.getElementById('logBase').select();
    }

    function insertCustomLog() {
        const base = document.getElementById('logBase').value.trim();
        if (!base) { alert('Введите основание логарифма'); return; }
        let func;
        if (base === 'e') func = 'ln(x)';
        else if (base === '10') func = 'log(x)';
        else func = `ln(x)/ln(${base})`;
        insertFunction(func);
        closeLogInput();
    }

    function closeLogInput() {
        document.getElementById('logGroup').style.display = 'none';
    }

    // ================================================================
    // ВСТАВКА ФУНКЦИЙ
    // ================================================================
    function insertFunction(func) {
        const input = document.getElementById('functionInput');
        input.value = func;
        updatePreview();
        hideHint();
        document.getElementById('resultBlock').classList.remove('visible');
        document.getElementById('errorMessage').innerHTML = '';
        input.focus();
        input.select();
    }

    // ================================================================
    // ПРЕДОБРАБОТКА ВВОДА (для Algebrite / math.js)
    // ================================================================
    function preprocessInput(func) {
        let f = func;
        f = f.replace(/\btg\s*\(/g, 'tan(');
        f = f.replace(/\bctg\s*\(/g, 'cot(');
        f = f.replace(/\bln\s*\(/g, 'log(');
        f = f.replace(/(\d)([a-zA-Z(])/g, '$1*$2');
        f = f.replace(/([a-zA-Z)])(\d)/g, '$1*$2');
        return f;
    }

    // Для math.js: tg → tan, ctg → cot, ln → log
    function toMathJS(expr) {
        let e = expr;
        e = e.replace(/\btg\s*\(/g, 'tan(');
        e = e.replace(/\bctg\s*\(/g, 'cot(');
        e = e.replace(/\bln\s*\(/g, 'log(');
        return e;
    }

    // ================================================================
    // ФОРМАТИРОВАНИЕ В LATEX
    // ================================================================
    function floatToFraction(num) {
        const fractions = {
            '0.3333333333333333': '\\frac{1}{3}',
            '0.33333333333333337': '\\frac{1}{3}',
            '0.6666666666666666': '\\frac{2}{3}',
            '0.6666666666666667': '\\frac{2}{3}',
            '0.5': '\\frac{1}{2}',
            '0.25': '\\frac{1}{4}',
            '0.75': '\\frac{3}{4}',
            '0.2': '\\frac{1}{5}',
            '0.4': '\\frac{2}{5}',
            '0.6': '\\frac{3}{5}',
            '0.8': '\\frac{4}{5}',
            '0.16666666666666666': '\\frac{1}{6}',
            '0.1666666666666667': '\\frac{1}{6}',
            '0.8333333333333334': '\\frac{5}{6}',
            '0.125': '\\frac{1}{8}',
            '0.375': '\\frac{3}{8}',
            '0.625': '\\frac{5}{8}',
            '0.875': '\\frac{7}{8}',
            '1.5': '\\frac{3}{2}',
            '2.5': '\\frac{5}{2}',
            '3.5': '\\frac{7}{2}',
            '1.3333333333333333': '\\frac{4}{3}',
            '1.3333333333333334': '\\frac{4}{3}',
            '2.3333333333333335': '\\frac{7}{3}',
            '3.3333333333333335': '\\frac{10}{3}',
            '1.6666666666666667': '\\frac{5}{3}',
            '2.6666666666666665': '\\frac{8}{3}',
            '3.6666666666666665': '\\frac{11}{3}'
        };
        return fractions[num.toString()] || null;
    }

    function toLatex(str) {
        let s = String(str);

        // ★ pi → \pi в самом начале
        s = s.replace(/\bpi\b/g, '\\pi');

        // cos(x)^2 → \cos^{2}(x)
        s = s.replace(/cos\(([^()]+)\)\^2/g, '\\cos^{2}($1)');
        s = s.replace(/sin\(([^()]+)\)\^2/g, '\\sin^{2}($1)');
        s = s.replace(/cos\(x\)\^2/g, '\\cos^{2} x');
        s = s.replace(/sin\(x\)\^2/g, '\\sin^{2} x');

        // tan / cot → tg / ctg
        s = s.replace(/\btan\s*\(/g, '\\tg(');
        s = s.replace(/\bcot\s*\(/g, '\\ctg(');

        // log → \ln (Algebrite log = натуральный)
        s = s.replace(/\blog\s*\(/g, '\\ln(');

        // exp(...) → e^{...}
        s = s.replace(/exp\(([^()]+)\)/g, 'e^{$1}');

        // sqrt(...) → \sqrt{...}
        s = s.replace(/sqrt\(([^()]+)\)/g, '\\sqrt{$1}');

        // ** → ^
        s = s.replace(/\*\*/g, '^');

        // Умножение: * → \cdot
        s = s.replace(/\*/g, ' \\cdot ');

        // Дроби из известных чисел
        s = s.replace(/(\d+\.\d+)/g, function(match) {
            const fr = floatToFraction(match);
            return fr || match;
        });

        // Дроби a/b → \frac{a}{b}
        for (let k = 0; k < 4; k++) {
            const before = s;
            s = s.replace(/\(([^()]+)\)\s*\/\s*\(([^()]+)\)/g, '\\frac{$1}{$2}');
            s = s.replace(/\(([^()]+)\)\s*\/\s*([a-zA-Z0-9\\^{}]+)/g, '\\frac{$1}{$2}');
            s = s.replace(/([a-zA-Z0-9\\^{}]+)\s*\/\s*\(([^()]+)\)/g, '\\frac{$1}{$2}');
            s = s.replace(/([a-zA-Z0-9\\^{}]+)\s*\/\s*([a-zA-Z0-9\\^{}]+)/g, '\\frac{$1}{$2}');
            if (s === before) break;
        }

        s = s.replace(/\\cdot\s*\\frac/g, '\\frac');
        s = s.replace(/\s+/g, ' ').trim();
        s = s.replace(/^\+\s*/, '');
        s = s.replace(/\+ -/g, '- ');
        s = s.replace(/- -/g, '+ ');

        return s;
    }

    // ================================================================
    // ПРОВЕРКА НА НЕБЕРУЩИЕСЯ
    // ================================================================
    function isNonElementary(func) {
        const patterns = [
            /sin\(x\^2\)/, /cos\(x\^2\)/, /sin\(e\^x\)/, /cos\(e\^x\)/,
            /e\^\(x\^2\)/, /e\^\(-x\^2\)/, /sin\(x\)\/x/, /cos\(x\)\/x/,
            /1\/log\(x\)/, /log\(log\(x\)\)/, /sqrt\(1-x\^4\)/
        ];
        return patterns.some(p => p.test(func));
    }

    function getNonElementaryMessage(func) {
        return `⚠️ Интеграл <b>${func}</b> не выражается через элементарные функции.<br>
                Для его вычисления требуются специальные функции (интегралы Френеля, эллиптические, и т.д.).`;
    }

    // ================================================================
    // ФОРМУЛА-ПОДСКАЗКА
    // ================================================================
    function detectIntegralFormula(func) {
        const f = func.toLowerCase().replace(/\s/g, '');

        if (f.match(/^x\^(\d+)$/)) {
            return {
                formula: '\\int x^n \\, dx = \\frac{x^{n+1}}{n+1} + C, \\quad n \\neq -1',
                desc: 'Степенная функция. Увеличиваем степень на 1 и делим на новую степень.'
            };
        }
        if (f === '1/x' || f === 'x^{-1}') {
            return {
                formula: '\\int \\frac{1}{x} \\, dx = \\ln|x| + C',
                desc: 'Интеграл от обратной функции — натуральный логарифм.'
            };
        }
        if (f.includes('sin')) {
            return {
                formula: '\\int \\sin(ax) \\, dx = -\\frac{1}{a}\\cos(ax) + C',
                desc: 'Интеграл от синуса — минус косинус, делённый на коэффициент при x.'
            };
        }
        if (f.includes('cos')) {
            return {
                formula: '\\int \\cos(ax) \\, dx = \\frac{1}{a}\\sin(ax) + C',
                desc: 'Интеграл от косинуса — синус, делённый на коэффициент при x.'
            };
        }
        if (f.includes('tg') || f.includes('tan')) {
            return {
                formula: '\\int \\tg x \\, dx = -\\ln|\\cos x| + C',
                desc: 'Интеграл от тангенса — минус логарифм косинуса.'
            };
        }
        if (f.includes('ctg') || f.includes('cot')) {
            return {
                formula: '\\int \\ctg x \\, dx = \\ln|\\sin x| + C',
                desc: 'Интеграл от котангенса — логарифм синуса.'
            };
        }
        if (f.includes('e^')) {
            return {
                formula: '\\int e^{ax} \\, dx = \\frac{1}{a} e^{ax} + C',
                desc: 'Интеграл от экспоненты — сама экспонента, делённая на коэффициент при x.'
            };
        }
        if (f.includes('ln') || f.includes('log')) {
            return {
                formula: '\\int \\ln x \\, dx = x\\ln x - x + C',
                desc: 'Интеграл от натурального логарифма (интегрирование по частям).'
            };
        }
        if (f.includes('sqrt(') || f.includes('^(1/2)')) {
            return {
                formula: '\\int \\sqrt{x} \\, dx = \\frac{2}{3} x^{3/2} + C',
                desc: 'Квадратный корень — это степень $x^{1/2}$.'
            };
        }
        if (f.includes('+') || f.includes('-')) {
            return {
                formula: '\\int [u(x) \\pm v(x)] \\, dx = \\int u(x) \\, dx \\pm \\int v(x) \\, dx',
                desc: 'Интеграл суммы/разности функций равен сумме/разности интегралов.'
            };
        }
        return {
            formula: '\\text{Используйте основные правила интегрирования}',
            desc: 'См. раздел «Первообразная и интеграл» в справочнике для полного списка формул.'
        };
    }

    async function showFormulaHint() {
        const func = document.getElementById('functionInput').value.trim();

        if (!func) {
            document.getElementById('hintFormula').innerHTML = '⚠️ Введите функцию';
            document.getElementById('hintDesc').innerHTML = 'Напишите $f(x)$ в поле ввода, чтобы получить подсказку.';
            document.getElementById('hintBlock').classList.add('show');
            typesetSafe();
            return;
        }

        const info = detectIntegralFormula(func);

        let typeText = currentType === 'indefinite'
            ? 'неопределённого интеграла (нахождение первообразной)'
            : 'определённого интеграла. Формула Ньютона-Лейбница: $\\int_a^b f(x) \\, dx = F(b) - F(a)$, где $F(x)$ — первообразная.';

        document.getElementById('hintFormula').innerHTML = `$$${info.formula}$$`;
        document.getElementById('hintDesc').innerHTML = `${info.desc}<br><br>🎯 Применяется для ${typeText}`;

        const hintBlock = document.getElementById('hintBlock');
        hintBlock.classList.add('show');
        await typesetSafe([hintBlock]);

        setTimeout(() => {
            hintBlock.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }, 100);
    }

    function hideHint() {
        document.getElementById('hintBlock').classList.remove('show');
    }

    // ================================================================
    // ПРЕДПРОСМОТР
    // ================================================================
    function updatePreview() {
        const func = document.getElementById('functionInput').value.trim();
        const previewDiv = document.getElementById('preview');
        if (func) {
            const formatted = toLatex(func);
            previewDiv.innerHTML = `\\( \\displaystyle f(x) = ${formatted} \\)`;
        } else {
            previewDiv.innerHTML = '<span class="preview-empty">\\( f(x) = ? \\)</span>';
        }
        typesetSafe([previewDiv]);
    }

    document.getElementById('functionInput').addEventListener('input', function() {
        updatePreview();
        hideHint();
    });

    // ================================================================
    // ТИП ИНТЕГРАЛА
    // ================================================================
    function setType(type) {
        currentType = type;
        document.getElementById('btnIndefinite').classList.toggle('active', type === 'indefinite');
        document.getElementById('btnDefinite').classList.toggle('active', type === 'definite');
        document.getElementById('limitsContainer').style.display = type === 'definite' ? 'block' : 'none';
        document.getElementById('errorMessage').innerHTML = '';
        document.getElementById('resultBlock').classList.remove('visible');
        hideHint();
    }

    // ================================================================
    // ЧИСЛЕННОЕ ИНТЕГРИРОВАНИЕ (метод Симпсона)
    // ================================================================
    function numericIntegral(fnStr, a, b, n) {
        n = n || 2000;
        if (n % 2 !== 0) n++;
        const h = (b - a) / n;
        let sum = 0;
        let compiled;
        try {
            const node = math.parse(toMathJS(fnStr));
            compiled = node.compile();
        } catch (e) {
            throw new Error('Не удалось разобрать функцию: ' + e.message);
        }
        for (let i = 0; i <= n; i++) {
            const x = a + i * h;
            let y;
            try {
                y = compiled.evaluate({ x: x });
            } catch (e) {
                y = NaN;
            }
            if (!isFinite(y)) {
                throw new Error('Функция не определена в точке x = ' + x);
            }
            let coef;
            if (i === 0 || i === n) coef = 1;
            else if (i % 2 === 0) coef = 2;
            else coef = 4;
            sum += coef * y;
        }
        return (h / 3) * sum;
    }

    // ================================================================
    // РАСПОЗНАВАНИЕ «КРАСИВЫХ» ЗНАЧЕНИЙ
    // ================================================================
    function guessExactLatex(value) {
        const knownValues = [
            { value: 0, latex: '0' },
            { value: Math.PI, latex: '\\pi' },
            { value: -Math.PI, latex: '-\\pi' },
            { value: Math.PI / 2, latex: '\\frac{\\pi}{2}' },
            { value: -Math.PI / 2, latex: '-\\frac{\\pi}{2}' },
            { value: Math.PI / 3, latex: '\\frac{\\pi}{3}' },
            { value: -Math.PI / 3, latex: '-\\frac{\\pi}{3}' },
            { value: Math.PI / 4, latex: '\\frac{\\pi}{4}' },
            { value: -Math.PI / 4, latex: '-\\frac{\\pi}{4}' },
            { value: Math.PI / 6, latex: '\\frac{\\pi}{6}' },
            { value: -Math.PI / 6, latex: '-\\frac{\\pi}{6}' },
            { value: 2 * Math.PI, latex: '2\\pi' },
            { value: -2 * Math.PI, latex: '-2\\pi' },
            { value: 1, latex: '1' },
            { value: -1, latex: '-1' },
            { value: 2, latex: '2' },
            { value: -2, latex: '-2' },
            { value: 3, latex: '3' },
            { value: -3, latex: '-3' },
            { value: 4, latex: '4' },
            { value: -4, latex: '-4' },
            { value: 0.5, latex: '\\frac{1}{2}' },
            { value: -0.5, latex: '-\\frac{1}{2}' },
            { value: 1.5, latex: '\\frac{3}{2}' },
            { value: -1.5, latex: '-\\frac{3}{2}' },
            { value: 1 / 3, latex: '\\frac{1}{3}' },
            { value: -1 / 3, latex: '-\\frac{1}{3}' },
            { value: 2 / 3, latex: '\\frac{2}{3}' },
            { value: -2 / 3, latex: '-\\frac{2}{3}' },
            { value: 4 / 3, latex: '\\frac{4}{3}' },
            { value: -4 / 3, latex: '-\\frac{4}{3}' },
            { value: 0.25, latex: '\\frac{1}{4}' },
            { value: -0.25, latex: '-\\frac{1}{4}' },
            { value: 0.75, latex: '\\frac{3}{4}' },
            { value: -0.75, latex: '-\\frac{3}{4}' },
            { value: 0.2, latex: '\\frac{1}{5}' },
            { value: 0.4, latex: '\\frac{2}{5}' },
            { value: 0.6, latex: '\\frac{3}{5}' },
            { value: 0.8, latex: '\\frac{4}{5}' },
            { value: Math.E, latex: 'e' },
            { value: Math.E - 1, latex: 'e - 1' },
            { value: 2 * Math.E, latex: '2e' },
            { value: 2 * (Math.E - 1), latex: '2(e - 1)' },
            { value: 1 / Math.E, latex: '\\frac{1}{e}' },
            { value: 1 - 1 / Math.E, latex: '1 - \\frac{1}{e}' },
            { value: Math.PI * Math.PI, latex: '\\pi^{2}' },
            { value: Math.PI * Math.PI / 4, latex: '\\frac{\\pi^{2}}{4}' },
            { value: Math.PI * Math.PI / 6, latex: '\\frac{\\pi^{2}}{6}' },
            { value: Math.PI * Math.PI / 2, latex: '\\frac{\\pi^{2}}{2}' },
            { value: -Math.PI * Math.PI / 2, latex: '-\\frac{\\pi^{2}}{2}' }
        ];

        const tol = 1e-5;
        for (const kv of knownValues) {
            if (Math.abs(value - kv.value) < tol) {
                return kv.latex;
            }
        }

        // Пробуем простую дробь p/q, q ≤ 20
        let bestFrac = null;
        let bestErr = 1e-5;
        for (let q = 1; q <= 20; q++) {
            const p = Math.round(value * q);
            const err = Math.abs(value - p / q);
            if (err < bestErr) {
                bestErr = err;
                bestFrac = { p, q };
            }
        }
        if (bestFrac) {
            if (bestFrac.q === 1) return String(bestFrac.p);
            if (bestFrac.p < 0) {
                return `-\\frac{${Math.abs(bestFrac.p)}}{${bestFrac.q}}`;
            }
            return `\\frac{${bestFrac.p}}{${bestFrac.q}}`;
        }

        // Иначе — число с 6 знаками
        return Number(value.toFixed(6)).toString();
    }

    // ================================================================
    // ВЫЧИСЛЕНИЕ ИНТЕГРАЛА
    // ================================================================
    function calculateIntegral() {
        document.getElementById('errorMessage').innerHTML = '';
        document.getElementById('resultBlock').classList.remove('visible');

        let func = document.getElementById('functionInput').value.trim();
        if (!func) {
            document.getElementById('errorMessage').innerHTML = '❌ Введите функцию f(x)';
            return;
        }

        if (typeof Algebrite === 'undefined') {
            document.getElementById('errorMessage').innerHTML = '❌ Библиотека не загружена. Проверьте подключение.';
            return;
        }

        if (currentType === 'indefinite' && isNonElementary(func)) {
            document.getElementById('integralResult').innerHTML = getNonElementaryMessage(func);
            document.getElementById('resultBlock').classList.add('visible');
            typesetSafe();
            return;
        }

        try {
            const processedFunc = preprocessInput(func);

            if (currentType === 'indefinite') {
                // ===== Неопределённый: символьно через Algebrite =====
                let result = Algebrite.integral(processedFunc, 'x');
                let resultString = result.toString();

                try {
                    const simplified = Algebrite.simplify(resultString);
                    resultString = simplified.toString();
                } catch (e) {}

                try {
                    const trigSimplified = Algebrite.trigsimp(resultString);
                    resultString = trigSimplified.toString();
                } catch (e) {}

                if (resultString === processedFunc && !processedFunc.includes('+') && !processedFunc.includes('-')) {
                    document.getElementById('integralResult').innerHTML =
                        `⚠️ Не удалось вычислить интеграл для <b>${func}</b>.<br>Возможно, он не выражается через элементарные функции.`;
                    document.getElementById('resultBlock').classList.add('visible');
                    typesetSafe();
                    return;
                }

                const display = toLatex(resultString);
                document.getElementById('integralResult').innerHTML = `\\( \\displaystyle ${display} + C \\)`;
                document.getElementById('resultBlock').classList.add('visible');
                typesetSafe([document.getElementById('resultBlock')]);

            } else {
                // ===== Определённый: численно методом Симпсона =====
                let lower = document.getElementById('lowerLimit').value.trim();
                let upper = document.getElementById('upperLimit').value.trim();

                if (lower === '' || upper === '') {
                    document.getElementById('errorMessage').innerHTML = '❌ Введите оба предела интегрирования';
                    return;
                }

                const processedLower = preprocessInput(lower);
                const processedUpper = preprocessInput(upper);

                let aNum, bNum;
                try {
                    aNum = math.evaluate(processedLower);
                    bNum = math.evaluate(processedUpper);
                } catch (e) {
                    document.getElementById('errorMessage').innerHTML = '❌ Не удалось вычислить пределы интегрирования';
                    return;
                }

                if (!isFinite(aNum) || !isFinite(bNum)) {
                    document.getElementById('integralResult').innerHTML = '⚠️ Пределы должны быть конечными числами';
                    document.getElementById('resultBlock').classList.add('visible');
                    typesetSafe([document.getElementById('resultBlock')]);
                    return;
                }

                if (Math.abs(aNum - bNum) < 1e-12) {
                    document.getElementById('integralResult').innerHTML = '\\( 0 \\)';
                    document.getElementById('resultBlock').classList.add('visible');
                    typesetSafe([document.getElementById('resultBlock')]);
                    return;
                }

                let numericValue;
                try {
                    numericValue = numericIntegral(processedFunc, aNum, bNum, 4000);
                } catch (e) {
                    document.getElementById('integralResult').innerHTML =
                        '⚠️ Не удалось вычислить: ' + e.message;
                    document.getElementById('resultBlock').classList.add('visible');
                    typesetSafe([document.getElementById('resultBlock')]);
                    return;
                }

                if (!isFinite(numericValue)) {
                    document.getElementById('integralResult').innerHTML =
                        '⚠️ Интеграл расходится (особая точка в интервале интегрирования)';
                    document.getElementById('resultBlock').classList.add('visible');
                    typesetSafe([document.getElementById('resultBlock')]);
                    return;
                }

                // Округляем до 6 знаков, чтобы убрать шум численного метода
                numericValue = Number(numericValue.toFixed(6));

                const exactLatex = guessExactLatex(numericValue);
                const approx = Number(numericValue.toFixed(6)).toString();

                // Если exactLatex — просто число и совпадает с approx, показываем без approx
                const isSimpleNumber = /^-?\d+(\.\d+)?$/.test(exactLatex);
                let finalHTML;
                if (isSimpleNumber && exactLatex === approx) {
                    finalHTML = `\\( \\displaystyle ${exactLatex} \\)`;
                } else {
                    finalHTML = `\\( \\displaystyle ${exactLatex} \\approx ${approx} \\)`;
                }

                document.getElementById('integralResult').innerHTML = finalHTML;
                document.getElementById('resultBlock').classList.add('visible');
                typesetSafe([document.getElementById('resultBlock')]);
            }
        } catch (error) {
            console.error('Ошибка:', error);
            document.getElementById('errorMessage').innerHTML =
                `❌ Ошибка: не удалось вычислить интеграл для '${func}'. Проверьте правильность ввода.`;
        }
    }

    // ================================================================
    // ТЕМА
    // ================================================================
    (function() {
        if (localStorage.getItem('mathTheme') === 'light') {
            document.documentElement.classList.add('light-mode');
            var btn = document.getElementById('themeBtn');
            if (btn) btn.textContent = '☀️';
        }
    })();

    // ================================================================
    // ИНИЦИАЛИЗАЦИЯ
    // ================================================================
    window.addEventListener('load', function() {
        if (window.MathJax && MathJax.startup && MathJax.startup.promise) {
            MathJax.startup.promise.then(updatePreview).catch(updatePreview);
        } else {
            setTimeout(updatePreview, 500);
        }
    });

    new MutationObserver(function() {
        updatePreview();
        if (document.getElementById('resultBlock').classList.contains('visible')) {
            typesetSafe([document.getElementById('resultBlock')]);
        }
    }).observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
</script>
