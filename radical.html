<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Калькулятор радикалов</title>
    <style>
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }

        :root {
          --bg: #1a2d3c;
          --card-bg: #1e3545;
          --text: #ffffff;
          --text-secondary: #8ba5b8;
          --accent: #1abc9c;
          --border: rgba(46, 204, 113, 0.1);
          --input-bg: #2c5a77;
          --result-bg: #0f2a38;
          --btn-bg: #34495e;
          --table-bg: #1a4a5a;
          --table-col-bg: #1e5062;
        }

        :root.light-mode {
          --bg: linear-gradient(145deg, #f5f7fc 0%, #eef2f8 100%);
          --card-bg: white;
          --text: #1a2a3f;
          --text-secondary: #6a7e9c;
          --accent: #1abc9c;
          --border: #eff3f8;
          --input-bg: #e2e8f0;
          --result-bg: #f1f5f9;
          --btn-bg: #d1d9e6;
          --table-bg: #e2e8f0;
          --table-col-bg: #f1f5f9;
        }

        body {
          font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
          background: var(--bg);
          min-height: 100vh;
          padding: 32px 20px;
        }

        .container {
          max-width: 700px;
          margin: 0 auto;
          position: relative;
        }

        .card {
          background: var(--card-bg);
          border-radius: 32px;
          padding: 24px;
          border: 1px solid var(--border);
          margin-top: 50px;
        }

        h1 {
          font-size: 1.5rem;
          text-align: center;
          margin-bottom: 8px;
          color: var(--text);
        }

        .sub {
          text-align: center;
          color: var(--text-secondary);
          font-size: 0.85rem;
          margin-bottom: 20px;
        }

        .input-group {
          display: flex;
          flex-wrap: wrap;
          gap: 12px;
          margin-bottom: 20px;
          align-items: center;
        }

        .input-group input {
          flex: 2;
          padding: 14px 16px;
          background: var(--input-bg);
          border: 1px solid var(--border);
          border-radius: 28px;
          font-size: 1rem;
          color: var(--text);
          outline: none;
          font-family: monospace;
        }

        .input-group select {
          flex: 1;
          padding: 14px 16px;
          background: var(--input-bg);
          border: 1px solid var(--border);
          border-radius: 28px;
          font-size: 1rem;
          color: var(--text);
          outline: none;
          cursor: pointer;
        }

        .calc-btn {
          padding: 14px 24px;
          background: var(--accent);
          border: none;
          border-radius: 28px;
          color: white;
          font-size: 1rem;
          font-weight: 600;
          cursor: pointer;
          transition: all 0.2s;
        }

        .calc-btn:hover {
          background: #16a085;
        }

        .calc-btn:active {
          transform: scale(0.97);
        }

        .result-panel {
          background: var(--result-bg);
          border-radius: 20px;
          padding: 20px;
          margin-bottom: 20px;
          color: var(--text);
          line-height: 1.8;
          font-size: 1.1rem;
          overflow-x: auto;
          min-height: 60px;
        }

        .result-line {
          margin-bottom: 12px;
          display: flex;
          flex-wrap: wrap;
          align-items: baseline;
          gap: 8px;
        }

        .result-line:last-child {
          margin-bottom: 0;
        }

        /* ★ Раскрывающийся блок таблицы */
        .table-container {
          background: var(--table-bg);
          border-radius: 20px;
          padding: 0;
          overflow: hidden;
        }

        details.table-details {
          width: 100%;
        }

        details.table-details > summary {
          list-style: none;
          cursor: pointer;
          padding: 16px 20px;
          font-weight: 600;
          color: var(--text);
          font-size: 0.95rem;
          display: flex;
          justify-content: space-between;
          align-items: center;
          user-select: none;
          transition: background 0.15s;
        }

        details.table-details > summary::-webkit-details-marker {
          display: none;
        }

        details.table-details > summary:hover {
          background: rgba(255, 255, 255, 0.05);
        }

        details.table-details > summary::after {
          content: '▸';
          font-size: 1.2rem;
          color: var(--accent);
          transition: transform 0.2s;
          display: inline-block;
        }

        details.table-details[open] > summary::after {
          transform: rotate(90deg);
        }

        details.table-details > .table-content {
          padding: 0 16px 16px;
        }

        #tableContainer {
          overflow-x: visible;
        }
        #tableContainer table {
          width: 100%;
          border-collapse: collapse;
          table-layout: fixed;
        }
        #tableContainer th {
          background: var(--accent);
          color: white;
          font-weight: 600;
          padding: 10px 6px;
          text-align: center;
          font-size: 0.9rem;
        }
        #tableContainer th:first-child {
          border-radius: 12px 0 0 0;
        }
        #tableContainer th:last-child {
          border-radius: 0 12px 0 0;
        }
        #tableContainer td {
          color: var(--text);
          padding: 8px 4px;
          text-align: center;
          font-size: 0.95rem;
          border-bottom: 1px solid var(--border);
        }
        #tableContainer td:first-child {
          font-weight: 600;
        }
        #tableContainer tr:nth-child(even) {
          background: rgba(0,0,0,0.03);
        }

        .footnote {
          font-size: 0.7rem;
          color: var(--text-secondary);
          margin-top: 12px;
          text-align: center;
        }

        .back-link {
          display: inline-block;
          margin-top: 20px;
          padding: 8px 20px;
          background: var(--accent);
          color: white;
          text-decoration: none;
          border-radius: 40px;
          font-weight: 600;
          font-size: 0.9rem;
          text-align: center;
        }

        .back-link:hover {
          background: #16a085;
        }

        @media (max-width: 550px) {
          body {
            padding: 20px 16px;
          }
          .input-group {
            flex-direction: column;
          }
          .input-group input, .input-group select, .calc-btn {
            width: 100%;
          }
          #tableContainer th {
            padding: 8px 4px;
            font-size: 0.8rem;
          }
          #tableContainer td {
            padding: 6px 4px;
            font-size: 0.85rem;
          }
        }
        @media (max-width: 400px) {
          #tableContainer th {
            font-size: 0.7rem;
            padding: 6px 2px;
          }
          #tableContainer td {
            font-size: 0.75rem;
            padding: 5px 2px;
          }
        }

/* ===== ФИНАЛЬНЫЙ ФИКС: центрирование заголовков и градиент ===== */
.section-title {
    display: flex !important;
    flex-direction: column !important; /* Элементы друг под другом */
    align-items: center !important;    /* Центрируем по горизонтали */
    justify-content: center !important;
    text-align: center !important;
    position: relative !important;
    padding: 8px 40px !important; /* Отступы по бокам (40px справа для стрелки) */
    margin-bottom: 8px !important;
    border-left: 4px solid var(--special-border, #3b82f6) !important;
    background: transparent !important;
    border-radius: 0 12px 12px 0 !important;
    transition: background 0.3s ease, color 0.2s ease !important;
    box-shadow: none !important; /* Убираем свечение */
}

/* Наведение: градиентный фон */
.section-title:hover {
    background: linear-gradient(90deg, 
        var(--special-border, #3b82f6) 0%, 
        rgba(13, 148, 136, 0.15) 30%, 
        rgba(13, 148, 136, 0.05) 100%) !important;
}
.section-title:active {
    background: linear-gradient(90deg, 
        var(--special-border, #3b82f6) 0%, 
        rgba(13, 148, 136, 0.25) 30%, 
        rgba(13, 148, 136, 0.1) 100%) !important;
}

/* Псевдоэлемент ::before больше не нужен, скрываем */
.section-title::before {
    display: none !important;
}

/* Центрируем внутренние элементы (заголовок и подзаголовок) */
.section-title .main-title,
.section-title > span:not(.sub-title) {
    display: block !important;
    width: 100% !important;
    text-align: center !important;
    justify-content: center !important;
    font-size: 1.1rem !important;
    margin: 0 !important;
}

.section-title .sub-title {
    display: block !important;
    width: 100% !important;
    text-align: center !important;
    font-size: 0.85rem !important;
    color: var(--text-secondary) !important;
    margin-top: 4px !important;
}

/* Стрелка ▼ строго справа по центру высоты */
.section-title::after {
    position: absolute !important;
    right: 16px !important;
    top: 50% !important;
    transform: translateY(-50%) !important;
    margin: 0 !important;
}
.section.collapsed .section-title::after {
    transform: translateY(-50%) rotate(-90deg) !important;
}
/* ===== Парение, тень и градиент для карточек ===== */
.example, .formula-block, .theorem-text, .important, .interval-card, .def-card, .note-box, .task-block, .task-condition, .task-given-find {
    position: relative !important;
    border-radius: 16px !important;

    transition: transform 0.2s ease, box-shadow 0.2s ease !important;

    padding-left: 20px !important;
    background-color: var(--example-bg, var(--formula-bg, var(--info-bg, #162a38))) !important;
    margin-bottom: 16px !important;
}

/* Градиентная полоска слева */
.example::before, .formula-block::before, .theorem-text::before, .important::before, .interval-card::before, .def-card::before, .note-box::before, .task-block::before, .task-condition::before, .task-given-find::before {

<div class="container">
    <div class="card">
        <h1>🧮 Калькулятор радикалов</h1>
        <div class="sub">Корни любой степени, степени числа, упрощение</div>

        <div class="input-group">
            <input type="number" id="numInput" placeholder="Введите число" value="625" step="any">
            <select id="rootDegree">
                <option value="2">Квадратный корень (√)</option>
                <option value="3">Кубический корень (∛)</option>
                <option value="4">Корень 4-й степени</option>
                <option value="5">Корень 5-й степени</option>
                <option value="6">Корень 6-й степени</option>
                <option value="7">Корень 7-й степени</option>
                <option value="8">Корень 8-й степени</option>
                <option value="9">Корень 9-й степени</option>
                <option value="10">Корень 10-й степени</option>
            </select>
            <button class="calc-btn" id="calcBtn">Вычислить</button>
        </div>

        <div class="result-panel" id="resultPanel">
            Введите число и нажмите «Вычислить»
        </div>

        <div class="table-container">
            <details class="table-details">
                <summary>📊 Квадраты и кубы чисел (2–20)</summary>
                <div class="table-content">
                    <div id="tableContainer"></div>
                    <div class="footnote">Подсказка: √ — квадратный корень, ∛ — кубический</div>
                </div>
            </details>
        </div>
    </div>

    <div style="text-align: center;">
        <a href="index.html" class="back-link">← Назад в меню</a>
    </div>
</div>

<script>
    function isInteger(value, tolerance = 1e-9) {
      return Math.abs(value - Math.round(value)) < tolerance;
    }

    function findExactRoot(n, degree) {
      if (n < 0 && degree % 2 === 0) return null;
      const root = Math.pow(Math.abs(n), 1 / degree);
      if (isInteger(root)) {
        const result = Math.round(root);
        return n < 0 ? -result : result;
      }
      return null;
    }

    function simplifyRoot(n, degree) {
      if (n === 0) return { outside: 0, inside: 0, display: '0', perfect: true };
      if (n === 1) return { outside: 1, inside: 1, display: '1', perfect: true };
      if (n < 0 && degree % 2 === 0) return null;

      const absN = Math.abs(n);
      let outside = 1;
      let inside = absN;

      for (let i = 2; Math.pow(i, degree) <= inside; i++) {
        const power = Math.pow(i, degree);
        while (inside % power === 0 && inside >= power) {
          outside *= i;
          inside /= power;
        }
      }

      if (inside === 1) {
        const result = n < 0 ? -outside : outside;
        return { outside: result, inside: 1, display: `${result}`, perfect: true };
      }

      return {
        outside: n < 0 ? -outside : outside,
        inside: inside,
        display: outside === 1 ? `\\sqrt[${degree}]{${inside}}` : `${outside}\\sqrt[${degree}]{${inside}}`,
        perfect: false
      };
    }

    function findPowerRepresentation(n) {
      if (n <= 1 || !isInteger(n)) return null;
      const intN = Math.round(Math.abs(n));
      const sign = n < 0 ? -1 : 1;
      const results = [];
      const limit = Math.floor(Math.sqrt(intN)) + 1;

      for (let base = 2; base <= limit; base++) {
        let exp = 2;
        let power = base * base;
        while (power <= intN) {
          if (power === intN) {
            results.push({ base: sign * base, exponent: exp });
          }
          exp++;
          power *= base;
          if (power > intN) break;
        }
      }
      return results.length > 0 ? results : null;
    }

    function decimalRoot(n, degree) {
      if (n < 0 && degree % 2 === 0) return NaN;
      return Math.pow(n, 1 / degree);
    }

    function formatNumber(value) {
      if (typeof value === 'number' && isInteger(value)) {
        return Math.round(value).toString();
      }
      return value.toString();
    }

    function analyzeNumber(rawInput, degree) {
      const value = parseFloat(rawInput);
      if (isNaN(value)) {
        return { error: 'Введите число.' };
      }

      const n = value;
      const exactRoot = findExactRoot(n, degree);
      const simplified = simplifyRoot(n, degree);
      const decimal = decimalRoot(n, degree);
      const powers = findPowerRepresentation(n);

      return {
        input: n,
        degree: degree,
        exactRoot: exactRoot,
        simplified: simplified,
        decimal: decimal,
        powers: powers,
        isIntegerResult: exactRoot !== null
      };
    }

    function renderResult(analysis) {
      if (analysis.error) {
        return `<div style="color: #e74c3c;">⚠️ ${analysis.error}</div>`;
      }

      const n = analysis.input;
      const degree = analysis.degree;
      const exactRoot = analysis.exactRoot;
      const simplified = analysis.simplified;
      const decimal = analysis.decimal;
      const powers = analysis.powers;

      let html = '';

      let degreeName = '';
      if (degree === 2) degreeName = 'квадратный';
      else if (degree === 3) degreeName = 'кубический';
      else degreeName = `${degree}-й степени`;

      if (exactRoot !== null && !isNaN(exactRoot)) {
        html += `<div class="result-line">🔹 \\( \\sqrt[${degree}]{${formatNumber(n)}} = ${exactRoot} \\) (точный ${degreeName} корень)</div>`;
      } else if (simplified && !isNaN(decimal)) {
        html += `<div class="result-line">🔸 \\( \\sqrt[${degree}]{${formatNumber(n)}} = ${simplified.display} \\) (упрощённый вид)</div>`;
        html += `<div class="result-line" style="font-size:0.9rem; color: var(--text-secondary);">
        ↳ десятично: \\( \\sqrt[${degree}]{${formatNumber(n)}} \\approx ${decimal.toFixed(8)} \\)</div>`;
      } else if (!isNaN(decimal)) {
        html += `<div class="result-line">🔸 \\( \\sqrt[${degree}]{${formatNumber(n)}} \\approx ${decimal.toFixed(8)} \\)</div>`;
      } else {
        html += `<div class="result-line">⚠️ Корень ${degreeName} из отрицательного числа не определён в действительных числах</div>`;
      }

      if (powers && powers.length > 0) {
        html += `<div class="result-line" style="margin-top: 8px;">`;
        html += `🔷 \\( ${formatNumber(n)} = `;
        const powerStrings = powers.map(p => `${p.base}^{${p.exponent}}`);
        html += powerStrings.join(' = ');
        html += ` \\)</div>`;
      }

      return html;
    }

    function buildTable() {
      let html = '<table>';
      html += '<thead><tr>';
      html += '<th>n</th><th>n²</th><th>n³</th>';
      html += '</tr></thead><tbody>';

      for (let i = 2; i <= 20; i++) {
        html += '<tr>';
        html += `<td>${i}</td>`;
        html += `<td>${i * i}</td>`;
        html += `<td>${i * i * i}</td>`;
        html += '</tr>';
      }

      html += '</tbody></table>';
      return html;
    }

    function updateUI() {
      const rawValue = document.getElementById('numInput').value.trim();
      const degree = parseInt(document.getElementById('rootDegree').value);

      if (rawValue === '') {
        document.getElementById('resultPanel').innerHTML = `<div>Введите число.</div>`;
        return;
      }

      const analysis = analyzeNumber(rawValue, degree);
      const resultHtml = renderResult(analysis);
      document.getElementById('resultPanel').innerHTML = resultHtml;

      if (window.MathJax) {
        if (typeof MathJax.typesetPromise === 'function') {
          MathJax.typesetPromise();
        } else if (typeof MathJax.typeset === 'function') {
          MathJax.typeset();
        }
      }
    }

    function renderTable() {
      document.getElementById('tableContainer').innerHTML = buildTable();
    }

    (function() {
      if (localStorage.getItem('mathTheme') === 'light') {
        document.documentElement.classList.add('light-mode');
        const __btn = document.getElementById('themeBtn'); if (__btn) __btn.textContent = '☀️';
      }
    })();

    document.getElementById('calcBtn').addEventListener('click', updateUI);
    document.getElementById('numInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') updateUI();
    });
    document.getElementById('rootDegree').addEventListener('change', updateUI);

    renderTable();
    updateUI();

    // Перетипизация MathJax после загрузки страницы (на случай, если ещё не готова)
    window.addEventListener('load', function() {
      setTimeout(function() {
        if (window.MathJax && typeof MathJax.typesetPromise === 'function') {
          MathJax.typesetPromise();
        }
      }, 300);
    });
</script>

<script id="bottom-nav-autohide-script">
/* Автоскрытие нижней панели при скролле */
(function(){
    var nav = document.querySelector('.bottom-nav');
    if (!nav) return;
    var lastY = window.scrollY;
    var threshold = 8;
    var ticking = false;
    function onScroll(){
        var y = window.scrollY;
        if (Math.abs(y - lastY) < threshold) { ticking = false; return; }
        if (y > lastY && y > 80) {
            nav.classList.add('nav-hidden');
        } else {
            nav.classList.remove('nav-hidden');
        }
        lastY = y;
        ticking = false;
    }
    window.addEventListener('scroll', function(){
        if (!ticking) { requestAnimationFrame(onScroll); ticking = true; }
    }, { passive: true });
})();
</script>

<script id="math-nav-ripple">
/* Добавляем Ripple (волну) при нажатии на кнопки панели */
(function() {
    var els = document.querySelectorAll('.bottom-nav a, .bottom-nav button');
    els.forEach(function(el) {
        if (el.dataset.rippleBound) return;
        el.dataset.rippleBound = '1';
        el.classList.add('ripple-host');
        el.addEventListener('pointerdown', function(e) {
            var rect = el.getBoundingClientRect();
            var size = Math.max(rect.width, rect.height);
            var r = document.createElement('span');
            r.className = 'ripple';
            r.style.width = r.style.height = size + 'px';
            r.style.left = (e.clientX - rect.left - size/2) + 'px';
            r.style.top  = (e.clientY - rect.top  - size/2) + 'px';
            el.appendChild(r);
            setTimeout(function(){ r.remove(); }, 650);
        });
    });
})();
</script>
