    <title>Калькулятор квадратных уравнений</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #1a2d3c;
            --card-bg: #1e3545;
            --text: #ffffff;
            --text-secondary: #8ba5b8;
            --accent: #1abc9c;
            --border: rgba(46, 204, 113, 0.1);
            --input-bg: #2c5a77;
            --btn-bg: #2c5a77;
            --result-bg: #0f2a38;
            --discriminant: #f39c12;
            --header-bg: linear-gradient(135deg, #1e3545, #162a38);
        }

        :root.light-mode {
            --bg: linear-gradient(145deg, #f5f7fc 0%, #eef2f8 100%);
            --card-bg: white;
            --text: #1a2a3f;
            --text-secondary: #6a7e9c;
            --accent: #1abc9c;
            --border: #eff3f8;
            --input-bg: #e2e8f0;
            --btn-bg: #e2e8f0;
            --result-bg: #f1f5f9;
            --discriminant: #e67e22;
            --header-bg: linear-gradient(135deg, #ffffff, #f8fafc);
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            padding: 32px 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            position: relative;
        }

        .card {
            background: var(--card-bg);
            border-radius: 32px;
            padding: 24px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.2);
            margin-top: 20px;
        }

        h1 {
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 8px;
            color: var(--text);
        }

        .subtitle {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-bottom: 24px;
        }

        .formula {
            background: var(--result-bg);
            padding: 16px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 24px;
            font-size: 1.1rem;
            color: var(--text);
            overflow-x: auto;
        }

        .formula mjx-container {
            font-size: 1.1rem !important;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: var(--text);
            font-weight: 500;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            background: var(--input-bg);
            border-radius: 16px;
            padding: 0 16px;
            border: 1px solid var(--border);
        }

        .input-prefix {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--accent);
            margin-right: 12px;
        }

        input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 14px 0;
            font-size: 1rem;
            color: var(--text);
            outline: none;
        }

        input::placeholder {
            color: var(--text-secondary);
            opacity: 0.6;
        }

        .solve-btn {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            border: none;
            border-radius: 40px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }

        .solve-btn:active {
            transform: scale(0.97);
        }

        .result {
            margin-top: 24px;
            background: var(--result-bg);
            border-radius: 20px;
            padding: 16px;
        }

        .result-title {
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 12px;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        .discriminant-value {
            color: var(--discriminant);
            font-weight: 700;
            font-size: 1.2rem;
            font-family: monospace;
        }

        .roots {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        .root-item {
            display: flex;
            align-items: baseline;
            gap: 12px;
            margin-bottom: 8px;
            font-family: monospace;
            font-size: 1rem;
            color: var(--text);
        }

        .root-label {
            font-weight: 600;
            color: var(--accent);
            min-width: 30px;
        }

        .root-value {
            font-weight: 700;
            word-break: break-all;
        }

        .error-message {
            color: #e74c3c;
            text-align: center;
            margin-top: 12px;
            font-size: 0.9rem;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: var(--accent);
            color: white;
            text-decoration: none;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            text-align: center;
        }

        @media (max-width: 500px) {
            body {
                padding: 20px 16px;
            }
            .card {
                padding: 20px;
            }
            h1 {
                font-size: 1.3rem;
            }
        }

/* ===== ФИНАЛЬНЫЙ ФИКС: центрирование заголовков и градиент ===== */
.section-title {
    display: flex !important;
    flex-direction: column !important; /* Элементы друг под другом */
    align-items: center !important;    /* Центрируем по горизонтали */
    justify-content: center !important;
    text-align: center !important;
    position: relative !important;
    padding: 8px 40px !important; /* Отступы по бокам (40px справа для стрелки) */
    margin-bottom: 8px !important;
    border-left: 4px solid var(--special-border, #3b82f6) !important;
    background: transparent !important;
    border-radius: 0 12px 12px 0 !important;
    transition: background 0.3s ease, color 0.2s ease !important;
    box-shadow: none !important; /* Убираем свечение */
}

/* Наведение: градиентный фон */
.section-title:hover {
    background: linear-gradient(90deg, 
        var(--special-border, #3b82f6) 0%, 
        rgba(13, 148, 136, 0.15) 30%, 
        rgba(13, 148, 136, 0.05) 100%) !important;
}
.section-title:active {
    background: linear-gradient(90deg, 
        var(--special-border, #3b82f6) 0%, 
        rgba(13, 148, 136, 0.25) 30%, 
        rgba(13, 148, 136, 0.1) 100%) !important;
}

/* Псевдоэлемент ::before больше не нужен, скрываем */
.section-title::before {
    display: none !important;
}

/* Центрируем внутренние элементы (заголовок и подзаголовок) */
.section-title .main-title,
.section-title > span:not(.sub-title) {
    display: block !important;
    width: 100% !important;
    text-align: center !important;
    justify-content: center !important;
    font-size: 1.1rem !important;
    margin: 0 !important;
}

.section-title .sub-title {
    display: block !important;
    width: 100% !important;
    text-align: center !important;
    font-size: 0.85rem !important;
    color: var(--text-secondary) !important;
    margin-top: 4px !important;
}

/* Стрелка ▼ строго справа по центру высоты */
.section-title::after {
    position: absolute !important;
    right: 16px !important;
    top: 50% !important;
    transform: translateY(-50%) !important;
    margin: 0 !important;
}
.section.collapsed .section-title::after {
    transform: translateY(-50%) rotate(-90deg) !important;
}
/* ===== Парение, тень и градиент для карточек ===== */
.example, .formula-block, .theorem-text, .important, .interval-card, .def-card, .note-box, .task-block, .task-condition, .task-given-find {
    position: relative !important;
    border-radius: 16px !important;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12) !important;
    transition: transform 0.2s ease, box-shadow 0.2s ease !important;
    border-left: none !important;
    padding-left: 20px !important;
    background-color: var(--example-bg, var(--formula-bg, var(--info-bg, #162a38))) !important;
    margin-bottom: 16px !important;
}

/* Градиентная полоска слева */
.example::before, .formula-block::before, .theorem-text::before, .important::before, .interval-card::before, .def-card::before, .note-box::before, .task-block::before, .task-condition::before, .task-given-find::before {
    content: "" !important;
    position: absolute !important;
    left: 0 !important;
    top: 0 !important;
    bottom: 0 !important;
    width: 5px !important;
    background: linear-gradient(180deg, var(--special-border, #ef4444) 0%, #0d9488 100%) !important;
    border-radius: 16px 0 0 16px !important;
    z-index: 1 !important;
}

/* Эффект парения при наведении (только на ПК) */
@media (hover: hover) {
    .example:hover, .formula-block:hover, .theorem-text:hover, .important:hover, .interval-card:hover, .def-card:hover, .note-box:hover, .task-block:hover, .task-condition:hover, .task-given-find:hover {
        transform: translateY(-3px) !important;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2) !important;
    }
}
/* ===== Жесткое центрирование кнопки Назад ===== */
a.back-link, .back-link {

    margin-bottom: 10px !important;  /* Отступ снизу */

<div class="container">
    <div class="card">
        <h1>📐 Квадратное уравнение</h1>
        <div class="subtitle">$ax^2 + bx + c = 0$</div>

        <div class="formula">
            $$x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}$$
        </div>

        <div class="input-group">
            <label>Коэффициент <i>a</i></label>
            <div class="input-wrapper">
                <span class="input-prefix">a =</span>
                <input type="number" id="a" placeholder="например, 1" step="any" value="">
            </div>
        </div>

        <div class="input-group">
            <label>Коэффициент <i>b</i></label>
            <div class="input-wrapper">
                <span class="input-prefix">b =</span>
                <input type="number" id="b" placeholder="например, -5" step="any" value="">
            </div>
        </div>

        <div class="input-group">
            <label>Коэффициент <i>c</i></label>
            <div class="input-wrapper">
                <span class="input-prefix">c =</span>
                <input type="number" id="c" placeholder="например, 6" step="any" value="">
            </div>
        </div>

        <button class="solve-btn" onclick="solveQuadratic()">РЕШИТЬ</button>

        <div id="result" class="result" style="display: none;">
            <div class="result-title">📊 РЕЗУЛЬТАТ</div>
            <div>Дискриминант: <span id="discriminant" class="discriminant-value"></span></div>
            <div id="roots" class="roots"></div>
        </div>
        <div id="errorMessage" class="error-message"></div>
    </div>

    <div style="text-align: center;">
        <a href="formulas.html" class="back-link">← Назад к формулам</a>
    </div>
</div>

<script>
    function solveQuadratic() {
        document.getElementById('errorMessage').innerHTML = '';
        document.getElementById('result').style.display = 'none';

        let a = parseFloat(document.getElementById('a').value);
        let b = parseFloat(document.getElementById('b').value);
        let c = parseFloat(document.getElementById('c').value);

        if (isNaN(a) || isNaN(b) || isNaN(c)) {
            document.getElementById('errorMessage').innerHTML = '❌ Введите все коэффициенты (числа)';
            return;
        }

        if (a === 0) {
            document.getElementById('errorMessage').innerHTML = '❌ Коэффициент a не может быть равен 0 (это не квадратное уравнение)';
            return;
        }

        let D = b * b - 4 * a * c;
        document.getElementById('discriminant').innerHTML = D;

        let rootsHtml = '';

        if (D < 0) {
            rootsHtml = '<div style="color: #e74c3c;">❌ Действительных корней нет (D < 0)</div>';
        } else if (D === 0) {
            let x = (-b) / (2 * a);
            rootsHtml = `
                <div class="root-item">
                    <span class="root-label">x₁ = x₂ =</span>
                    <span class="root-value">${x}</span>
                </div>
            `;
        } else {
            let sqrtD = Math.sqrt(D);
            let x1 = (-b + sqrtD) / (2 * a);
            let x2 = (-b - sqrtD) / (2 * a);

            x1 = parseFloat(x1.toFixed(10));
            x2 = parseFloat(x2.toFixed(10));

            rootsHtml = `
                <div class="root-item">
                    <span class="root-label">x₁ =</span>
                    <span class="root-value">${x1}</span>
                </div>
                <div class="root-item">
                    <span class="root-label">x₂ =</span>
                    <span class="root-value">${x2}</span>
                </div>
            `;
        }

        document.getElementById('roots').innerHTML = rootsHtml;
        document.getElementById('result').style.display = 'block';
    }

    document.querySelectorAll('input').forEach(input => {
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') solveQuadratic();
        });
    });

    // Тема
    (function() {
        var savedTheme = localStorage.getItem('mathTheme');
        if (savedTheme === 'light') {
            document.documentElement.classList.add('light-mode');
            var btn = document.getElementById('themeBtn');
            if (btn) btn.textContent = '☀️';
        }
    })();
    }
</script>

<script id="bottom-nav-autohide-script">
/* Автоскрытие нижней панели при скролле */
(function(){
    var nav = document.querySelector('.bottom-nav');
    if (!nav) return;
    var lastY = window.scrollY;
    var threshold = 8;
    var ticking = false;
    function onScroll(){
        var y = window.scrollY;
        if (Math.abs(y - lastY) < threshold) { ticking = false; return; }
        if (y > lastY && y > 80) {
            nav.classList.add('nav-hidden');
        } else {
            nav.classList.remove('nav-hidden');
        }
        lastY = y;
        ticking = false;
    }
    window.addEventListener('scroll', function(){
        if (!ticking) { requestAnimationFrame(onScroll); ticking = true; }
    }, { passive: true });
})();
</script>

/* Добавляем Ripple (волну) при нажатии на кнопки панели */
(function() {
    var els = document.querySelectorAll('.bottom-nav a, .bottom-nav button');
    els.forEach(function(el) {
        if (el.dataset.rippleBound) return;
        el.dataset.rippleBound = '1';
        el.classList.add('ripple-host');
        el.addEventListener('pointerdown', function(e) {
            var rect = el.getBoundingClientRect();
            var size = Math.max(rect.width, rect.height);
            var r = document.createElement('span');
            r.className = 'ripple';
            r.style.width = r.style.height = size + 'px';
            r.style.left = (e.clientX - rect.left - size/2) + 'px';
            r.style.top  = (e.clientY - rect.top  - size/2) + 'px';
            el.appendChild(r);
            setTimeout(function(){ r.remove(); }, 650);
        });
    });
})();
</script>
</body>
</html>
